A.goDay=el=>{UI.view='day';goDate(el.dataset.v)};
A.navBy=el=>goDate(addD(UI.date,+el.dataset.v));
A.moBy=el=>{const p=(UI.month||UI.date.slice(0,7)).split('-');const d=new Date(+p[0],p[1]-1+ +el.dataset.v,1);UI.month=ymd(d).slice(0,7);if(UI.date.slice(0,7)!==UI.month)UI.date=UI.month===today().slice(0,7)?today():ymd(d);ensureSeries(addD(ymd(d),45));render()};
A.goToday=()=>goDate(today());
A.filter=el=>{UI.filter=el.dataset.v||null;render()};
A.ripple=()=>{S.set.ripple=!S.set.ripple;save();render();Isl.say(S.set.ripple?'الإزاحة التلقائية شغّالة':'الإزاحة التلقائية اتقفلت','fast_forward',S.set.ripple?'لما تحرّك مهمة، اللي بعدها بيتزق':'')};
A.zoom=el=>{S.set.hh=clamp(S.set.hh+ +el.dataset.v*12,32,104);save();render()};
A.clearDemo=()=>{clearDemo();commit();Isl.say('اتمسحت الأمثلة','delete_sweep')};
A.carry=()=>{pushUndo();const n=carryOver();commit();Isl.notify({icon:'update',title:N(n)+' مهام اترحّلت لليوم',actions:[{l:'تراجع',fn:A.undo}]})};
A.tlTap=(el,e)=>{if(e.target!==el)return;const r=el.getBoundingClientRect();const m=clamp(Math.floor(((e.clientY-r.top)/S.set.hh*60)/15)*15,0,1425);openEditor(null,{mode:'range',start:m,end:Math.min(1440,m+S.set.defDur)})};
A.pickDate=()=>{openSheet({title:'روح ليوم',body:()=>`<div class="chips"><button class="chip" data-a="jump" data-v="0">النهارده</button><button class="chip" data-a="jump" data-v="1">بكرة</button><button class="chip" data-a="jump" data-v="7">بعد أسبوع</button><button class="chip" data-a="jump" data-v="-1">امبارح</button></div>
  <div class="fld"><label class="lbl" for="jump-d">تاريخ محدد</label><input class="inp" type="date" id="jump-d" value="${UI.date}" data-c="jumpDate"></div>`})};
A.jump=el=>{closeSheet();goDate(addD(today(),+el.dataset.v))};
I.jumpDate=el=>{if(el.value){closeSheet();goDate(el.value)}};

/* ---------- search ---------- */
function searchRes(){const q=UI.q.trim().toLowerCase();if(!q)return '<p class="hint">اكتب اسم مهمة أو كلمة من الملاحظات.</p>';
  const a=S.tasks.filter(t=>(t.title+' '+(t.notes||'')).toLowerCase().includes(q)).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,40);
  return a.length?a.map(t=>rowHTML(t,true)).join(''):'<p class="hint">مفيش نتايج.</p>'}
A.search=()=>{UI.q='';openSheet({title:'بحث',body:()=>`<input class="inp" id="q-in" type="search" placeholder="دوّر في كل المهام" data-i="q" value="${esc(UI.q)}" autocomplete="off"><div id="q-res">${searchRes()}</div>`});setTimeout(()=>{const e=$('#q-in');if(e)e.focus()},250)};
I.q=el=>{UI.q=el.value;const r=$('#q-res');if(r)r.innerHTML=searchRes()};

/* ================= task detail, editor, shift, postpone, share, feedback ================= */
const PRI=['بدون','منخفضة','متوسطة','عالية'];
const REMS=[[null,'بدون'],[0,'عند الوقت'],[5,'قبلها 5 د'],[10,'10 د'],[15,'15 د'],[30,'30 د'],[60,'ساعة']];
const REPS=[['none','مرة واحدة'],['daily','يوميًا'],['days','أيام محددة'],['weekly','أسبوعيًا'],['monthly','شهريًا']];
const repLabel=t=>{const r=t.rep&&S.series[t.rep];if(!r)return '';return r.type==='days'?(r.days||[]).map(d=>DOW[d]).join(' '):(REPS.find(x=>x[0]===r.type)||[])[1]||''};
const tmVal=m=>m==null?'':pad(Math.floor((m%1440)/60))+':'+pad(m%60);
const tmParse=v=>{if(!v)return null;const a=v.split(':');return +a[0]*60+ +a[1]};

A.undo=()=>{if(undoApply()){commit();Isl.say('رجّعنا آخر تغيير','undo')}};
A.newTask=()=>{Isl.open=false;openEditor(null,{})};
A.open=el=>{if(Drag.just)return;Isl.open=false;openDetail(el.dataset.id)};
A.tToggle=el=>{const t=byId(el.dataset.id);if(!t)return;if(t.run)pauseTask(t);else{startTask(t);Snd.chime('start');vib(15)}commit()};
A.tPause=el=>{const t=byId(el.dataset.id);if(t){pauseTask(t);commit()}};
A.tDone=el=>{const t=byId(el.dataset.id);if(!t)return;pushUndo();if(t.done){reopenTask(t);commit()}else{finishTask(t);vib(25);commit();afterFinish(t)}};
function afterFinish(t){Snd.chime('done');const day=dayTasks(t.date),all=day.length>0&&day.every(x=>x.done);if(all&&S.set.confetti)confetti();
  const sp=span(t);let late=0;if(t.date===today()&&sp&&t.mode!=='open')late=nowMin()-sp.e;
  const fol=sp?day.filter(x=>!x.done&&x.start!=null&&x.start>=sp.s&&x!==t):[];
  if(S.set.autoShift&&late>=5&&fol.length)Isl.notify({icon:'fast_forward',title:'خلصت متأخر '+fmtDur(late),sub:'أزيح '+N(fol.length)+' مهام بعدها؟',ttl:9000,actions:[{l:'أزِح',fn:()=>{pushUndo();shiftAfter(t.date,sp.s,late,t.id);commit();Isl.say('اتزاحت المهام '+fmtDur(late),'fast_forward')}},{l:'لا'}]});
  else Isl.notify({icon:'task_alt',color:'good',title:all?'خلصت كل مهام اليوم':'تمت',sub:t.title,ttl:5200,actions:[{l:'قيّمها',fn:()=>openFeedback(t.id)},{l:'تراجع',fn:A.undo}]})}

/* ---------- detail ---------- */
let DT=null;
function openDetail(id){const t=byId(id);if(!t)return;DT=id;
  openSheet({live:true,cls:'dt',title:()=>{const x=byId(DT);return x?x.title:''},body:detailHTML,onClose:()=>{DT=null},
    head:()=>`<button class="ib" data-a="edit" data-id="${DT}" aria-label="تعديل">${ic('edit')}</button>`})}
function detailHTML(){const t=byId(DT);if(!t)return '<p class="muted">المهمة دي اتحذفت.</p>';
  const st=status(t),p=prog(t),pl=plannedMin(t),c=catById(t.cat),el=elapsedMs(t),rem=remainMs(t),hasSubs=t.subs&&t.subs.length>0;
  let h=`<div class="dt-hero" style="--tc:var(--c${t.color})"><div class="chips" style="justify-content:center"><span class="st s-${st}">${stLabel(t,st)}</span>${c?`<span class="chip">${ic(c.i)}${esc(c.n)}</span>`:''}${t.pri?`<span class="chip"><i class="pdm p${t.pri}"></i>${PRI[t.pri]}</span>`:''}${t.rep?`<span class="chip">${ic('repeat')}${repLabel(t)}</span>`:''}${t.sp?`<span class="chip">${ic('call_split')}${partLabel(t)}</span>`:''}</div>
    <div class="dt-ring" ${hasSubs||t.done?'':'data-drag="1"'} data-id="${t.id}">${ring(p,176,13,t.id)}<div class="dt-c"><span class="dt-pct"><span data-live="pc:${t.id}">${N(p)}</span>%</span><span class="dt-tm" data-live="tm:${t.id}">${t.run||t.acc||pl?timerText(t):''}</span><span class="dt-lb">${t.done?'تمت':rem!=null?(rem>=0?'باقي':'زيادة'):(t.run||t.acc?'وقت الشغل':hasSubs?'من الخطوات':'اسحب الدايرة')}</span></div></div>
    <div class="dt-btns">${t.done?`<button class="btn" data-a="tDone" data-id="${t.id}">${ic('replay')}إعادة فتح</button>`:`<button class="btn dark" data-a="tToggle" data-id="${t.id}">${ic(t.run?'pause':'play_arrow')}${t.run?'إيقاف مؤقت':t.acc?'كمّل':'ابدأ'}</button><button class="btn pri" data-a="tDone" data-id="${t.id}">${ic('check')}خلصت</button>`}</div></div>`;
  h+=`<dl class="kv"><dt>${ic('event')}اليوم</dt><dd>${relDay(t.date)}${diffD(t.date,today())>2||diffD(t.date,today())<-1?'':' · '+dateShort(t.date)}</dd>
    <dt>${ic('schedule')}المخطط</dt><dd>${timeText(t)}${pl?` <span class="muted">(${fmtDur(pl)})</span>`:''}</dd>

let SPL=null;
const splAt=m=>{const d=new Date(Date.now()+m*60000);d.setSeconds(0,0);if(m<SPLIT_MAX)d.setMinutes(Math.ceil(d.getMinutes()/5)*5);return d.getTime()};
const dtLocal=ts=>{const d=new Date(ts);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const splWhen=ts=>{const d=new Date(ts);return relDay(ymd(d))+' '+fmtT(d.getHours()*60+d.getMinutes())};

  openSheet({title:'كمّل بعدين',body:splitHTML,foot:()=>`<button class="btn pri" data-a="splitGo">${ic('call_split')}قسّم وكمّل بعدين</button>`})}
function splitHTML(){const t=byId(SPL.id);if(!t)return '<p class="muted">المهمة دي اتحذفت.</p>';const dn=(t.subs||[]).filter(s=>s.d).length,lf=(t.subs||[]).length-dn,timed=t.mode==='range'||t.mode==='dur',now=Date.now();
  return `<p class="hint" style="margin-bottom:12px">اللي خلصته من «${esc(t.title)}» هيتقفل كجزء تم، والباقي هيبقى مهمة لوحدها في الميعاد اللي تختاره، بحد أقصى 24 ساعة من دلوقتي.</p>
  <div class="fld"><div class="lbl">${ic('schedule')}هتكمّل إمتى؟</div><div class="chips">${[[60,'بعد ساعة'],[120,'بعد ساعتين'],[240,'بعد 4 ساعات'],[720,'بعد 12 ساعة'],[SPLIT_MAX,'بكرة نفس الوقت']].map(o=>`<button class="chip ${SPL.q===o[0]?'on':''}" data-a="splitQ" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>
    <input class="inp" style="margin-top:8px" type="datetime-local" id="spl-at" value="${dtLocal(SPL.at)}" min="${dtLocal(now)}" max="${dtLocal(now+SPLIT_MAX*60000)}" data-c="splitAt" aria-label="ميعاد التكملة">

  ${timed?`<div class="fld" style="margin-top:12px"><label class="lbl" for="spl-min">${ic('timelapse')}الباقي محتاج كام دقيقة؟</label><input class="inp" id="spl-min" type="number" inputmode="numeric" min="5" max="1440" step="5" value="${SPL.mins}" data-i="splitMin" dir="ltr"></div>`:''}

  ${dn+lf?`<p class="hint" style="margin-top:10px">${dn?'الخطوات اللي خلصت ('+N(dn)+') هتفضل في الجزء اللي تم':'مفيش خطوات خلصت'}${lf?'، والباقية ('+N(lf)+') هتتنقل مع الباقي.':'.'}</p>`:''}`}

/* ---------- swipe a row in the list: right deletes, left postpones ---------- */
function swipeDelete(id){const t=byId(id);if(!t)return;if((t.rep&&S.series[t.rep])||(t.gid&&S.g.on))return askDelete(id);
  pushUndo();delTask(id);vib(20);commit();Isl.notify({icon:'delete',title:'اتحذفت',sub:t.title,ttl:6500,actions:[{l:'تراجع',fn:A.undo}]})}
const Swipe={row:null,
  down(e){if(!S.set.swipe||Drag.on||Sheets.length)return;if(e.pointerType==='mouse'&&e.button!==0)return;const row=e.target.closest('.row[data-row]');if(!row||e.target.closest('.row-btns'))return;
    Object.assign(this,{row,id:row.dataset.row,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,dx:0,bg:null})},
  move(e){if(!this.row||e.pointerId!==this.pid)return;const dx=e.clientX-this.x,dy=e.clientY-this.y;
    if(!this.on){if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){this.row=null;return}if(Math.abs(dx)<14||Math.abs(dx)<Math.abs(dy)*1.4)return;
      this.on=true;try{this.row.setPointerCapture(this.pid)}catch(x){}this.row.classList.add('swiping');
      const v=this.row.offsetParent||this.row.parentElement;this.bg=document.createElement('div');this.bg.className='sw-bg';this.bg.style.top=this.row.offsetTop+'px';this.bg.style.height=this.row.offsetHeight+'px';v.insertBefore(this.bg,v.firstChild)}
    this.dx=clamp(dx,-170,170);this.row.style.transform='translateX('+this.dx+'px)';const del=this.dx>0,far=Math.abs(this.dx)>=88;
    this.bg.className='sw-bg '+(del?'del':'pp')+(far?' far':'');this.bg.innerHTML=del?ic('delete')+'<span>حذف</span>':'<span>تأجيل</span>'+ic('snooze');
    if(far&&!this.buzz){this.buzz=true;vib(10)}else if(!far)this.buzz=false},
  up(e){if(!this.row||(e&&e.pointerId!==this.pid))return;const row=this.row,on=this.on,dx=this.dx,id=this.id,bg=this.bg;this.row=null;if(!on)return;
    this.just=true;setTimeout(()=>{this.just=false},350);row.classList.add('sw-back');row.style.transform='';setTimeout(()=>{row.classList.remove('swiping','sw-back');if(bg)bg.remove()},210);
    if(e&&e.type==='pointercancel')return;if(dx>=88)swipeDelete(id);else if(dx<=-88)A.postpone({dataset:{id}})}
};

/* ================= sound: chimes, generated ambience, local music player ================= */
const AMB=[['rain','مطر','water_drop'],['waves','بحر','waves'],['wind','رياح','air'],['fire','نار','fireplace'],['brown','ضوضاء بنية','grain'],['pad','نغمات هادئة','piano'],['tick','تكتكة ساعة','schedule']];
const Snd={ctx:null,master:null,on:{},bufs:{},sleepAt:0,
  ac(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{this.ctx=new C()}catch(e){return null}
      this.master=this.ctx.createGain();this.master.gain.value=S.amb.master??.8;this.master.connect(this.ctx.destination)}
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return this.ctx},
  noise(type){if(this.bufs[type])return this.bufs[type];const c=this.ctx,n=c.sampleRate*5,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let last=0,b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      if(type==='white')d[i]=w*.5;else if(type==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.2}
      else{b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}}
    return this.bufs[type]=b},
  src(type){const s=this.ctx.createBufferSource();s.buffer=this.noise(type);s.loop=true;s.start();return s},
  bq(type,f,q){const n=this.ctx.createBiquadFilter();n.type=type;n.frequency.value=f;if(q)n.Q.value=q;return n},
  gn(v){const g=this.ctx.createGain();g.gain.value=v;return g},
  lfo(f,depth,target){const o=this.ctx.createOscillator();o.frequency.value=f;const g=this.gn(depth);o.connect(g).connect(target);o.start();return o},
  tone(f,t0,dur,vol,type,dest){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(dest||this.ctx.destination);o.start(t0);o.stop(t0+dur+.05)},
  chime(kind){if(!S.set.sound)return;const c=this.ac();if(!c)return;const t=c.currentTime+.02;
    const P={start:[[660,0,.18],[880,.09,.25]],done:[[523,0,.2],[659,.1,.2],[784,.2,.45]],remind:[[784,0,.25],[988,.16,.4]],alarm:[[880,0,.2],[880,.28,.2],[880,.56,.2],[1175,.84,.5]]}[kind]||[[700,0,.2]];
    P.forEach(n=>this.tone(n[0],t+n[1],n[2],.16,'sine'))},
  flip(){const c=this.ac();if(!c)return;const t=c.currentTime;this.tone(190,t,.05,.07,'square');this.tone(2400,t,.012,.03,'square')},
  build:{
    rain(S_,out){const a=S_.src('pink'),hp=S_.bq('highpass',900),lp=S_.bq('lowpass',7200);a.connect(hp).connect(lp).connect(out);const b=S_.src('brown'),l2=S_.bq('lowpass',260),g2=S_.gn(.45);b.connect(l2).connect(g2).connect(out);return ()=>{a.stop();b.stop()}},
    waves(S_,out){const a=S_.src('brown'),lp=S_.bq('lowpass',620),g=S_.gn(.5);a.connect(lp).connect(g).connect(out);const l=S_.lfo(.1,.42,g.gain);
      const w=S_.src('white'),hp=S_.bq('highpass',2400),g2=S_.gn(.035);w.connect(hp).connect(g2).connect(out);const l2=S_.lfo(.1,.03,g2.gain);return ()=>{a.stop();w.stop();l.stop();l2.stop()}},
    wind(S_,out){const a=S_.src('pink'),bp=S_.bq('bandpass',520,.9),g=S_.gn(.9);a.connect(bp).connect(g).connect(out);const l=S_.lfo(.07,300,bp.frequency),l2=S_.lfo(.13,.3,g.gain);return ()=>{a.stop();l.stop();l2.stop()}},
    fire(S_,out){const a=S_.src('brown'),lp=S_.bq('lowpass',330),g=S_.gn(.75);a.connect(lp).connect(g).connect(out);
      const iv=setInterval(()=>{if(Math.random()>.3)return;const c=S_.ctx,s=c.createBufferSource();s.buffer=S_.noise('white');const hp=S_.bq('highpass',1500+Math.random()*2500),e=c.createGain(),t=c.currentTime;e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(.12+Math.random()*.35,t+.004);e.gain.exponentialRampToValueAtTime(.0001,t+.03+Math.random()*.05);s.connect(hp).connect(e).connect(out);s.start(t,Math.random()*4,.12)},75);
      return ()=>{a.stop();clearInterval(iv)}},
    brown(S_,out){const a=S_.src('brown'),lp=S_.bq('lowpass',900);a.connect(lp).connect(out);return ()=>a.stop()},
    pad(S_,out){const c=S_.ctx,lp=S_.bq('lowpass',1100),dl=c.createDelay(1),fb=S_.gn(.38),wet=S_.gn(.5);lp.connect(out);lp.connect(dl);dl.delayTime.value=.46;dl.connect(fb).connect(dl);dl.connect(wet).connect(out);
      const CH=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]],PEN=[72,74,76,79,81,84];let i=0;const hz=m=>440*Math.pow(2,(m-69)/12);
      const chord=()=>{const t=c.currentTime+.05;CH[i++%4].forEach((m,k)=>[-5,5].forEach(det=>{const o=c.createOscillator(),g=c.createGain();o.type=k<2?'triangle':'sine';o.frequency.value=hz(m);o.detune.value=det;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.045,t+2.6);g.gain.setValueAtTime(.045,t+5.5);g.gain.linearRampToValueAtTime(.0001,t+9.5);o.connect(g).connect(lp);o.start(t);o.stop(t+9.7)}))};
      const bell=()=>{if(Math.random()<.55)S_.tone(hz(PEN[Math.random()*PEN.length|0]),c.currentTime+.05,2.6,.05,'sine',lp)};
      chord();const i1=setInterval(chord,8000),i2=setInterval(bell,2300);return ()=>{clearInterval(i1);clearInterval(i2)}},
    tick(S_,out){let k=0;const iv=setInterval(()=>{const t=S_.ctx.currentTime;S_.tone(k++%2?1500:1900,t,.035,.2,'square',out)},1000);return ()=>clearInterval(iv)}
  },
  vol(k){return S.amb[k]??.6},
  start(k){const c=this.ac();if(!c||this.on[k])return;const out=this.gn(0);out.connect(this.master);out.gain.linearRampToValueAtTime(this.vol(k),c.currentTime+1);const stop=this.build[k](this,out);this.on[k]={out,stop}},
  stop(k){const n=this.on[k];if(!n)return;delete this.on[k];try{n.out.gain.cancelScheduledValues(0);n.out.gain.setTargetAtTime(0,this.ctx.currentTime,.15)}catch(e){}setTimeout(()=>{try{n.stop();n.out.disconnect()}catch(e){}},700)},
  toggle(k){this.on[k]?this.stop(k):this.start(k)},
  setVol(k,v){S.amb[k]=v;if(this.on[k])this.on[k].out.gain.setTargetAtTime(v,this.ctx.currentTime,.05);save()},
  stopAll(){Object.keys(this.on).forEach(k=>this.stop(k))},
  any(){return Object.keys(this.on).length>0}
};

/* ---------- ID3v2 tags (title / artist / cover) ---------- */
async function readTags(file){const hd=new Uint8Array(await file.slice(0,10).arrayBuffer());if(hd[0]!==73||hd[1]!==68||hd[2]!==51)return {};
  const ver=hd[3],ss=(a,i)=>((a[i]&127)<<21)|((a[i+1]&127)<<14)|((a[i+2]&127)<<7)|(a[i+3]&127),size=ss(hd,6);
  const buf=new Uint8Array(await file.slice(10,10+Math.min(size,4e6)).arrayBuffer()),out={};let p=0;
  const dec=(b,enc)=>{try{return new TextDecoder(enc===1?'utf-16':enc===2?'utf-16be':enc===3?'utf-8':'iso-8859-1').decode(b).replace(/\0+$/,'').replace(/^﻿/,'').trim()}catch(e){return ''}};
  const hl=ver===2?6:10;
  while(p+hl<=buf.length){let id,sz;if(ver===2){id=String.fromCharCode(buf[p],buf[p+1],buf[p+2]);sz=(buf[p+3]<<16)|(buf[p+4]<<8)|buf[p+5]}
    else{id=String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);sz=ver===4?ss(buf,p+4):((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7])>>>0}
    if(!buf[p]||sz<=0||p+hl+sz>buf.length)break;const b=buf.subarray(p+hl,p+hl+sz);p+=hl+sz;
    if(id==='TIT2'||id==='TT2')out.title=dec(b.subarray(1),b[0]);else if(id==='TPE1'||id==='TP1')out.artist=dec(b.subarray(1),b[0]);
    else if((id==='APIC'||id==='PIC')&&!out.cover){const enc=b[0];let q=1,mime='image/jpeg';
      if(id==='APIC'){let e=q;while(e<b.length&&b[e])e++;mime=dec(b.subarray(q,e),0)||mime;q=e+1}else{mime='image/'+dec(b.subarray(1,4),0).toLowerCase().replace('jpg','jpeg');q=4}
      q++;if(enc===1||enc===2){while(q+1<b.length&&(b[q]||b[q+1]))q+=2;q+=2}else{while(q<b.length&&b[q])q++;q++}
      if(q<b.length)out.cover=new Blob([b.slice(q)],{type:/^image\//.test(mime)?mime:'image/jpeg'})}}
  return out}

/* ---------- player for the user's own audio files (kept in IndexedDB when available) ---------- */
const Player={list:[],idx:-1,el:null,shuffle:false,rep:'all',db:null,url:null,
  init(){const el=this.el=$('#player');const upd=()=>{Isl.draw();if(UI.tab==='sound')render();this.ms()};
    el.addEventListener('play',upd);el.addEventListener('pause',upd);el.addEventListener('ended',()=>this.next(true));
    el.addEventListener('timeupdate',()=>this.seekUI());el.addEventListener('error',()=>{if(el.src)Isl.notify({icon:'error',color:'crit',title:'الملف ده مش بيتشغل',sub:(this.cur()||{}).title})});
    this.loadDB()},
  cur(){return this.list[this.idx]||null},
  playing(){return !!(this.el&&!this.el.paused&&!this.el.ended&&this.cur()&&this.el.src)},
  async add(files){let n=0;for(const f of files){if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|aac|ogg|oga|wav|flac|opus|weba)$/i.test(f.name))continue;let m={};try{m=await readTags(f)}catch(e){}
      const tr={id:uid(),name:f.name,title:m.title||f.name.replace(/\.[^.]+$/,''),artist:m.artist||'',cover:m.cover||null,blob:f,o:Date.now()+n};if(tr.cover)tr.coverUrl=URL.createObjectURL(tr.cover);this.list.push(tr);this.store(tr);n++}
    if(this.idx<0&&this.list.length)this.idx=0;render();if(n)Isl.say(N(n)+' ملفات اتضافت','library_music');else Isl.notify({icon:'warning',title:'مفيش ملفات صوت في اللي اخترته'})},
  play(i){if(i!=null)this.idx=i;const tr=this.cur();if(!tr)return;if(this.url)URL.revokeObjectURL(this.url);this.url=URL.createObjectURL(tr.blob);this.el.src=this.url;
    const p=this.el.play();if(p&&p.catch)p.catch(()=>Isl.notify({icon:'error',color:'crit',title:'التشغيل اترفض',sub:'دوس تشغيل تاني'}));this.ms()},
  toggle(){if(!this.cur())return;if(!this.el.src||this.el.ended){this.play(this.idx);return}if(this.el.paused){const p=this.el.play();if(p&&p.catch)p.catch(()=>{})}else this.el.pause()},
  next(auto){const n=this.list.length;if(!n)return;if(auto&&this.rep==='one'){this.el.currentTime=0;this.el.play();return}
    let i;if(this.shuffle&&n>1){do{i=Math.random()*n|0}while(i===this.idx)}else{i=this.idx+1;if(i>=n){if(auto&&this.rep==='off'){Isl.draw();if(UI.tab==='sound')render();return}i=0}}this.play(i)},
  prev(){if(!this.list.length)return;if(this.el.currentTime>3){this.el.currentTime=0;return}this.play((this.idx-1+this.list.length)%this.list.length)},
  remove(id){const i=this.list.findIndex(t=>t.id===id);if(i<0)return;const was=i===this.idx;if(was){this.el.pause();this.el.removeAttribute('src')}this.list.splice(i,1);if(this.idx>=i)this.idx=Math.max(0,this.idx-1);if(!this.list.length)this.idx=-1;this.unstore(id);render();Isl.draw()},
  seekUI(){const s=$('#pl-seek');if(!s||!this.el.duration)return;if(document.activeElement!==s)s.value=Math.round(this.el.currentTime/this.el.duration*1000);const a=$('#pl-cur'),b=$('#pl-dur');if(a)a.textContent=fmtClock(this.el.currentTime*1000);if(b)b.textContent=fmtClock(this.el.duration*1000)},
  ms(){if(!('mediaSession' in navigator))return;try{const tr=this.cur();if(!tr)return;
      navigator.mediaSession.metadata=new MediaMetadata({title:tr.title,artist:tr.artist||'لوحة يومي',artwork:tr.coverUrl?[{src:tr.coverUrl,sizes:'512x512',type:tr.cover.type||'image/jpeg'}]:[]});
      navigator.mediaSession.playbackState=this.playing()?'playing':'paused';
      [['play',()=>this.toggle()],['pause',()=>this.el.pause()],['previoustrack',()=>this.prev()],['nexttrack',()=>this.next()]].forEach(h=>{try{navigator.mediaSession.setActionHandler(h[0],h[1])}catch(e){}})}catch(e){}},
  openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('yawmi-music',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async loadDB(){try{this.db=await this.openDB();const rq=this.db.transaction('tracks').objectStore('tracks').getAll();
      rq.onsuccess=()=>{const a=(rq.result||[]).filter(t=>t&&t.blob).sort((x,y)=>(x.o||0)-(y.o||0));a.forEach(t=>{if(t.cover)try{t.coverUrl=URL.createObjectURL(t.cover)}catch(e){}});if(!a.length)return;this.list=a.concat(this.list);if(this.idx<0)this.idx=0;if(UI.tab==='sound')render()}}catch(e){this.db=null}},
  store(tr){if(!this.db)return;try{const tx=this.db.transaction('tracks','readwrite');tx.objectStore('tracks').put({id:tr.id,name:tr.name,title:tr.title,artist:tr.artist,cover:tr.cover,blob:tr.blob,o:tr.o});tx.onerror=tx.onabort=()=>{}}catch(e){}},
  unstore(id){if(!this.db)return;try{this.db.transaction('tracks','readwrite').objectStore('tracks').delete(id)}catch(e){}}
};

function ckVals(){const c=S.ck,now=Date.now();

  return {a:N(pad(m)),b:N(pad(s%60)),s:null}}

    <div class="rowx" style="gap:8px;flex-wrap:wrap;justify-content:center"><button class="chip ${S.set.h12?'on':''}" data-a="ckOpt" data-v="h12">12 ساعة</button><button class="chip ${S.set.secs?'on':''}" data-a="ckOpt" data-v="secs">الثواني</button><button class="chip ${S.set.tick?'on':''}" data-a="ckOpt" data-v="tick">صوت القلبة</button><button class="chip" data-a="zen">${ic('fullscreen')}ملء الشاشة</button></div></section>`}
const Clock={wl:null,
  tick(){const c=S.ck,now=Date.now();

    else{try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}try{if(this.wl)await this.wl.release()}catch(e){}this.wl=null}Isl.draw()}
};

  async init(){if(FB.on){if(!FB.start()){this.state=FB.cfg()?'err':'nocfg';redrawSheets()}return}

  refresh(){if(!NV)return;try{this.info=JSON.parse(NV.info())||{}}catch(e){this.info={}}},
  wait(k){return new Promise(res=>{this.w[k]=res;setTimeout(()=>{if(this.w[k]===res){delete this.w[k];res(null)}},60000)})},
  done(k,v){const f=this.w[k];if(f){delete this.w[k];f(v)}},
  pending(){let a=[];try{a=JSON.parse(NV.takePending()||'[]')}catch(e){}let ch=false;a.forEach(d=>{if(natApply(d))ch=true});if(ch){IDXc=null;saveNow();render();Cloud.kick()}},
  init(){if(!NV)return;this.refresh();document.documentElement.classList.add('native');applyTheme();this.pending();this.ready=true;natSync();
    let asked=false;try{asked=localStorage.getItem('yawmi.natAsked')==='1'}catch(e){}
    if(!this.info.notif&&!asked){try{localStorage.setItem('yawmi.natAsked','1')}catch(e){}
      Isl.notify({icon:'notifications_active',title:'فعّل الإشعارات',sub:'علشان التذكير يوصلك والتطبيق مقفول',ttl:20000,actions:[{l:'فعّل',fn:()=>NV.requestNotif()},{l:'بعدين'}]})}
    try{NV.ready()}catch(e){}},
  /* stand-ins for the hosted page's capabilities */

      if(!Nat.info.cal){NV.calPerm();const ok=await Nat.wait('cal');Nat.refresh();if(!ok)throw {code:'not_granted',message:'calendar permission'}}

      if(tool==='list_events'){const r=NV.calList(ms(input.startTime),ms(input.endTime));if(!r)throw {code:'tool_error',message:'calendar read failed'};return {payload:{events:JSON.parse(r)}}}

      if(tool==='delete_event'){NV.calDelete(String(input.eventId));return {payload:{}}}
      throw {code:'bad_request',message:tool}}},
  dl:{async save(o){NV.save(o.filename,String(o.data));const ok=await Nat.wait('save');if(!ok)throw {code:'declined'};return {status:'saved'}}},
  /* now playing in other apps */
  extOn(){return !!(this.ext&&this.ext.playing&&this.ext.title)},

  soundHTML(){if(!NV)return '';let h='<div class="sec-t" style="margin-top:0">شغّال على الموبايل</div>';

  settingsHTML(){if(!NV)return '';const i=this.info,row=(l,s,ok,k,b)=>`<div class="set-r"><div><b>${l}</b><small>${s}</small></div>${ok?'<span class="dotst ok"></span>':`<button class="btn sm" data-a="natOpen" data-v="${k}">${b}</button>`}</div>`;
    return `<div class="set-g"><h3>التطبيق</h3>${row('الإشعارات',i.notif?'مفعّلة، والتذكير بيوصل والتطبيق مقفول':'مقفولة، والتذكير مش هيظهر برا التطبيق',i.notif,'notif','فعّل')}
      ${row('منبّه دقيق',i.exact?'التذكير بيشتغل في ميعاده بالظبط':'من غيره التذكير ممكن يتأخر دقايق',i.exact,'exact','اسمح')}
      ${row('الأغنية الشغّالة',i.media?'اللوحة شايفة التشغيل من التطبيقات التانية':'محتاجة إذن قراءة إشعارات التشغيل',i.media,'media','اسمح')}

};

/* push reminders, the running-task notification and audio state to Android */
const natSteps=t=>({subs:(t.subs||[]).filter(s=>!s.d).map(s=>({id:s.id,t:s.t})),total:(t.subs||[]).length});
function natSync(){if(!NV||!Nat.ready)return;const now=Date.now(),td=today(),lim=addD(td,14),a=[];
  for(const t of S.tasks){if(t.demo||t.done||t.run||t.start==null||t.rem==null||t.date<td||t.date>lim)continue;const at=dateTs(t.date,t.start-t.rem);if(at<=now+2000)continue;
    a.push(Object.assign({id:t.id,at,kind:'rem',name:t.title,title:t.rem?'«'+t.title+'» بعد '+fmtDur(t.rem):'حان وقت «'+t.title+'»',body:timeText(t),dur:plannedMin(t)||0,end:t.mode==='range'?dateTs(t.date,t.end):0},natSteps(t)))}
  const r=running(),rm=r?remainMs(r):null;if(r&&rm!=null&&rm>2000)a.push({id:r.id,at:now+rm,kind:'timer',name:r.title,title:'خلص وقت «'+r.title+'»',body:'تقفلها ولا تمدّ شوية؟'});
  const c=S.ck;if(c.run&&c.end>now)a.push({id:'pomo',at:c.end,kind:'pomo',title:c.phase==='focus'?'خلصت جولة التركيز':'خلصت الاستراحة',body:'لوحة يومي'});
  if(c.trun&&c.tend>now)a.push({id:'cd',at:c.tend,kind:'cd',title:'المؤقّت خلص',body:fmtDur(c.tset)});
  a.sort((x,y)=>x.at-y.at);const js=JSON.stringify(a.slice(0,48));
  try{if(js!==Nat.lastRem){Nat.lastRem=js;NV.setReminders(js)}
    const rj=r?JSON.stringify(Object.assign({id:r.id,title:r.title,sub:timeText(r),due:rm!=null&&rm>0?Math.round((now+rm)/1000)*1000:0,since:Math.round((now-elapsedMs(r))/1000)*1000},natSteps(r))):'';
    const key=r?r.id+'|'+r.title+'|'+(rm!=null&&rm>0?Math.round((now+rm)/5000):'e'+Math.round((now-elapsedMs(r))/5000))+'|'+(r.subs||[]).map(s=>s.id+(s.d?1:0)).join(','):'';
    if(key!==Nat.lastRun){Nat.lastRun=key;NV.setRunning(rj)}}catch(e){}}
function natAudio(){if(!NV)return;const tr=Player.playing()?Player.cur():null,amb=Object.keys(Snd.on).map(k=>(AMB.find(a=>a[0]===k)||[])[1]).filter(Boolean);
  const on=!!tr||amb.length>0,title=tr?tr.title:amb.join('، '),sub=tr?(tr.artist||'موسيقتي'):'أجواء';const key=on+'|'+title+'|'+sub;
  if(key===Nat.lastAud)return;Nat.lastAud=key;try{NV.setPlaying(on,title,sub)}catch(e){}}

/* events coming from Android */
window.__native=(ev,d)=>{try{d=d||{};
  if(ev==='nowplaying'){Nat.ext=d.title?d:null;Isl.draw();if(UI.tab==='sound')render()}
  else if(ev==='perm'){Nat.refresh();Nat.done(d.kind,!!d.ok);redrawSheets();if(UI.tab==='sound')render();natSync()}
  else if(ev==='saved')Nat.done('save',!!d.ok)
  else if(ev==='resume'){Nat.refresh();Nat.pending();tick();render()}
  else if(ev==='pending'){Nat.pending()}
  else if(ev==='player'){if(d.cmd==='toggle'){if(Player.cur())Player.toggle();else Snd.stopAll()}else if(d.cmd==='next')Player.next();else if(d.cmd==='prev')Player.prev();else{if(Player.el)Player.el.pause();Snd.stopAll()}Isl.draw();if(UI.tab==='sound'||UI.tab==='clock')render()}
  else if(ev==='action'&&d.native){if(natApply(d)){vib(10);commit()}}
  else if(ev==='action'){const t=byId(d.id);
    if(d.id==='pomo'||d.id==='cd'){setTab('clock');return}if(!t)return;closeAll();
    if(d.act==='start'){startTask(t);commit()}
    else if(d.act==='snooze'){pushUndo();moveBy(t,10);t.pp=(t.pp||0)+1;commit();Isl.say('اتأجلت 10 دقايق','snooze',t.title);return}
    else if(d.act==='done'){pushUndo();finishTask(t);commit();afterFinish(t);return}
    else if(d.act==='pause'){pauseTask(t);commit()}
    else if(d.act==='extend'){pushUndo();if(t.mode==='range')t.end=Math.max(t.end,t.date===today()?nowMin():t.end)+10;else if(t.mode==='dur')t.dur=Math.max(t.dur,Math.ceil(elapsedMs(t)/60000))+10;touch(t);commit()}
    UI.tab='tasks';goDate(t.date);openDetail(t.id)}}catch(e){console.error(e)}};
window.__nativeBack=()=>{if(Sheets.length){closeSheet();return true}if(document.body.classList.contains('zen')){Clock.zen(false);return true}if(Isl.open){Isl.open=false;Isl.draw();return true}if(Isl.al){Isl.next();return true}if(UI.tab!=='tasks'){setTab('tasks');return true}return false};

/* An action taken on a notification (maybe hours ago, with the app closed): apply it at the time it happened. */
function natApply(d){const t=d&&byId(d.id),at=+d.at||Date.now();if(!t)return false;
  const stopAt=()=>{if(t.run){t.acc=(t.acc||0)+Math.max(0,at-t.run);t.run=null}},finish=()=>{if(t.done)return;stopAt();t.done=true;t.doneAt=at;t.aE=at;if(!t.aS)t.aS=at;touch(t)};
  if(d.act==='start'){if(t.done||t.run)return false;const r=running();if(r&&r!==t){r.acc=(r.acc||0)+Math.max(0,at-r.run);r.run=null;touch(r)}startTask(t);t.run=at;if(!t.aS||t.aS>at)t.aS=at}
  else if(d.act==='pause'){if(!t.run)return false;stopAt();touch(t)}
  else if(d.act==='done')finish();
  else if(d.act==='step'){const s=(t.subs||[]).find(x=>x.id===d.sub);if(s&&!s.d){s.d=true;touch(t)}if(t.subs&&t.subs.length&&t.subs.every(x=>x.d))finish()}
  else if(d.act==='cost'){const c=parseCost(d.text);if(!c.a||!addCost(t,c.a,c.n,at))return false}
  else if(d.act==='snooze'){if(t.done||t.start==null)return false;moveBy(t,Math.max(10,Math.ceil((at-dateTs(t.date,t.start))/60000)+10));t.pp=(t.pp||0)+1}
  else if(d.act==='extend'){if(t.mode==='range')t.end=Math.max(t.end,t.date===today()?nowMin():t.end)+10;else if(t.mode==='dur')t.dur=Math.max(t.dur||0,Math.ceil(elapsedMs(t)/60000))+10;touch(t)}
  else return false;
  return true}

/* ================= main: render loop, ticking, input wiring ================= */
const TABS=['tasks','clock','sound','stats'];
function render(){const m=$('#main');if(!m)return;
  if(Drag.on){render.dirty=true;return}                       // never replace the timeline under a finger
  if(Drag.lp){clearTimeout(Drag.lp.tm);Drag.lp=null}Drag.cand=null;render.dirty=false;if(Swipe.row&&Swipe.on)return;Swipe.row=null;
  const key=UI.tab+'|'+UI.view+'|'+UI.date+'|'+(UI.month||''),st=m.scrollTop;
  m.innerHTML=UI.tab==='tasks'?tasksHTML():UI.tab==='clock'?clockHTML():UI.tab==='sound'?soundHTML():statsHTML();
  if(key!==render.key){m.scrollTop=0;
    if(UI.tab==='tasks'&&UI.view==='day'){const tl=$('.tl');if(tl)m.scrollTop=Math.max(0,tl.offsetTop+(UI.date===today()?nowMin():480)/60*S.set.hh-150)}
    if(UI.tab==='tasks'&&UI.view==='week'){const w=$('.wg');if(w)m.scrollTop=Math.max(0,w.offsetTop+7*24-120)}}
  else m.scrollTop=st;
  render.key=key;$$('#dock .dk').forEach(b=>{const on=b.dataset.v===UI.tab;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  Isl.draw();redrawSheets();Player.seekUI()}
function commit(o){IDXc=null;save();render();Cloud.kick();if(!o||o.g!==false)G.kick()}
function setTab(t){if(document.body.classList.contains('zen')&&t!=='clock')Clock.zen(false);UI.tab=t;
  try{if(location.hash.slice(1)!==t)history.replaceState(null,'','#'+t)}catch(e){}render()}
A.tab=el=>{Isl.open=false;setTab(el.dataset.v)};

/* ---------- once a second ---------- */
let lastMin=-1,lastDay='';const ALERTED={};
function liveUpdate(){$$('[data-live]').forEach(el=>{const p=el.dataset.live,k=p.slice(0,2),t=byId(p.slice(3));if(!t)return;
    const v=k==='el'?fmtClock(elapsedMs(t)):k==='tm'?(t.run||t.acc||plannedMin(t)?timerText(t):''):N(prog(t));if(el.textContent!==v)el.textContent=v});
  const r=running();if(r){const p=prog(r);$$('[data-ring="'+r.id+'"]').forEach(el=>setRing(el,p));$$('[data-bar="'+r.id+'"]').forEach(el=>el.style.width=p+'%')}}
function checkTimers(){const t=running();if(!t)return;const r=remainMs(t);if(r==null||r>0)return;const key=(t.mode==='range'?t.end:t.dur)+'';if(ALERTED[t.id]===key)return;ALERTED[t.id]=key;
  Snd.chime('alarm');vib([200,100,200]);
  Isl.notify({icon:'alarm',color:t.color,title:'خلص وقت «'+t.title+'»',sub:'تقفلها ولا تمدّ شوية؟',ttl:20000,actions:[
    {l:'خلصت',fn:()=>{pushUndo();finishTask(t);commit();afterFinish(t)}},
    {l:'+10 د',fn:()=>{pushUndo();if(t.mode==='range')t.end=Math.max(t.end,t.date===today()?nowMin():t.end)+10;else t.dur=Math.max(t.dur,Math.ceil(elapsedMs(t)/60000))+10;touch(t);if(S.set.ripple)rippleDay(t.date);commit()}}]})}
function sysNotify(title,body){try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(title,{body})}catch(e){}}
function checkReminders(){const td=today(),now=Date.now(),keep={};
  for(const t of dayTasks(td)){if(S.fired[t.id])keep[t.id]=S.fired[t.id];if(t.demo||t.done||t.run||t.start==null||t.rem==null)continue;const at=dateTs(td,t.start-t.rem);
    if(now>=at&&now<at+10*60000&&S.fired[t.id]!==at){keep[t.id]=at;Snd.chime('remind');vib([120,80,120]);const ttl=t.rem?'«'+t.title+'» بعد '+fmtDur(t.rem):'حان وقت «'+t.title+'»';sysNotify(ttl,timeText(t));
      Isl.notify({icon:t.icon,color:t.color,title:ttl,sub:timeText(t),ttl:15000,actions:[{l:'ابدأ',fn:()=>{startTask(t);commit()}},{l:'أجّل 10',fn:()=>{pushUndo();moveBy(t,10);t.pp=(t.pp||0)+1;commit()}}]})}}
  S.fired=keep}
const typing=()=>{const a=document.activeElement;return a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
function tick(){liveUpdate();Clock.tick();checkTimers();const m=new Date().getMinutes();
  if(m!==lastMin){lastMin=m;const td=today();if(td!==lastDay){if(lastDay&&UI.date===lastDay){UI.date=td;UI.month=td.slice(0,7)}lastDay=td;ensureSeries(addD(td,21))}
    checkReminders();natSync();if(!Drag.on&&!typing()&&!document.hidden)render();else Isl.draw()}}

/* ---------- timeline drag ---------- */
let dtip=null;
function tlInfo(){const g=$('.tl-grid');return g?{r:g.getBoundingClientRect(),hh:S.set.hh}:null}
function dragStart(el,mode,y){const t=byId(el.dataset.id),i=tlInfo();if(!t||!i||!el.isConnected||t.start==null||t.done)return false;const sp=span(t);
  Object.assign(Drag,{on:true,mode,t,el,s0:sp.s,e0:Math.min(sp.e,1440),s:sp.s,e:Math.min(sp.e,1440),off:y-(i.r.top+sp.s/60*i.hh),moved:false,vy:0,raf:0});
  el.classList.add('drag');if(!dtip){dtip=document.createElement('div');dtip.className='tl-tip';document.body.append(dtip)}dtip.classList.remove('hide');vib(12);return true}
function dragApply(x,y){const i=tlInfo();if(!i||!Drag.on)return;const sn=S.set.snap,len=Drag.e0-Drag.s0;
  if(Drag.mode==='move'){const s=clamp(snapTo((y-Drag.off-i.r.top)/i.hh*60,sn),0,1440-Math.min(len,60));Drag.s=s;Drag.e=s+len}
  else Drag.e=clamp(snapTo((y-i.r.top)/i.hh*60,sn),Drag.s0+Math.min(sn,15),1440);
  if(Drag.s!==Drag.s0||Drag.e!==Drag.e0)Drag.moved=true;
  Drag.el.style.top=(Drag.s/60*i.hh)+'px';Drag.el.style.height=Math.max(20,(Drag.e-Drag.s)/60*i.hh)+'px';
  dtip.textContent=fmtT(Drag.s)+' – '+fmtT(Drag.e);dtip.style.left=clamp(x,70,innerWidth-70)+'px';dtip.style.top=Math.max(70,y)+'px'}
function dragMove(x,y){Drag.lx=x;Drag.ly=y;dragApply(x,y);const mr=$('#main').getBoundingClientRect();Drag.vy=y<mr.top+90?-9:y>mr.bottom-130?9:0;
  if(Drag.vy&&!Drag.raf){const loop=()=>{if(!Drag.on||!Drag.vy){Drag.raf=0;return}$('#main').scrollTop+=Drag.vy;dragApply(Drag.lx,Drag.ly);Drag.raf=requestAnimationFrame(loop)};Drag.raf=requestAnimationFrame(loop)}}
function dragEnd(cancel){if(!Drag.on)return;Drag.on=false;Drag.vy=0;if(dtip)dtip.classList.add('hide');Drag.el.classList.remove('drag');
  if(!cancel&&Drag.moved){const t=Drag.t;pushUndo();
    if(Drag.mode==='move'){const d=Drag.s-t.start;t.start=Drag.s;if(t.mode==='range')t.end+=d;t.sh=(t.sh||0)+d}
    else if(t.mode==='range')t.end=Drag.e;else if(t.mode==='dur')t.dur=Drag.e-t.start;
    touch(t);let n=0;if(S.set.ripple)n=rippleDay(t.date);Drag.just=true;setTimeout(()=>{Drag.just=false},380);commit();
    if(n)Isl.notify({icon:'fast_forward',title:N(n)+' مهام اتزاحت بعدها',actions:[{l:'تراجع',fn:A.undo}]})}
  else if(Drag.moved||render.dirty)render()}

/* ---------- event wiring ---------- */
function bind(){const M=$('#main');
  document.addEventListener('click',e=>{if(Isl.open&&!e.target.closest('#isl')){Isl.open=false;Isl.draw()}
    const el=e.target.closest('[data-a]');if(!el)return;if(Drag.just&&el.closest('.tl')){return}if(Swipe.just&&el.closest('.row')){return}const f=A[el.dataset.a];if(f){if(el.tagName!=='A'&&el.tagName!=='LABEL')e.preventDefault();f(el,e)}});
  document.addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(el&&I[el.dataset.i])I[el.dataset.i](el,e)});
  document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&I[el.dataset.c])I[el.dataset.c](el,e)});
  document.addEventListener('submit',e=>e.preventDefault());
  document.addEventListener('keydown',e=>{const tg=e.target,inField=/INPUT|TEXTAREA|SELECT/.test(tg.tagName);
    if(e.key==='Enter'&&tg.dataset&&tg.dataset.k&&A[tg.dataset.k]&&!e.isComposing){e.preventDefault();A[tg.dataset.k](tg,e);return}
    if(e.key==='Escape'){if(Sheets.length)closeSheet();else if(document.body.classList.contains('zen'))Clock.zen(false);else if(Isl.open){Isl.open=false;Isl.draw()}return}
    if(inField||Sheets.length||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
    if(k==='n'||e.key==='ى'){e.preventDefault();A.newTask()}else if(k==='t'||e.key==='ف'){A.goToday()}else if(e.key==='/'){e.preventDefault();A.search()}
    else if(UI.tab==='tasks'&&e.key==='ArrowLeft')goDate(addD(UI.date,1));else if(UI.tab==='tasks'&&e.key==='ArrowRight')goDate(addD(UI.date,-1));
    else if(UI.tab==='tasks'&&/^[1-5]$/.test(e.key)){UI.view=VIEWS[+e.key-1][0];horizon();render()}});
  /* timeline: mouse drag, edge resize (all pointers), touch long-press move */
  M.addEventListener('pointerdown',e=>{const b=e.target.closest('.tl-b');if(!b)return;const rs=e.target.closest('.tl-rs');
    if(rs){e.preventDefault();if(dragStart(b,'size',e.clientY)){Drag.pid=e.pointerId;Drag.touch=false;try{rs.setPointerCapture(e.pointerId)}catch(x){}}return}
    if(e.pointerType==='mouse'&&e.button===0)Drag.cand={b,x:e.clientX,y:e.clientY}});
  window.addEventListener('pointermove',e=>{if(Drag.on&&!Drag.touch){dragMove(e.clientX,e.clientY)}
    else if(Drag.cand&&e.pointerType==='mouse'&&(Math.abs(e.clientY-Drag.cand.y)>4||Math.abs(e.clientX-Drag.cand.x)>4)){const c=Drag.cand;Drag.cand=null;if(dragStart(c.b,'move',c.y)){Drag.touch=false;dragMove(e.clientX,e.clientY)}}});
  window.addEventListener('pointerup',()=>{Drag.cand=null;if(Drag.on&&!Drag.touch)dragEnd()});
  window.addEventListener('pointercancel',()=>{Drag.cand=null;if(Drag.on&&!Drag.touch)dragEnd(true)});
  M.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const b=e.target.closest('.tl-b');if(!b||e.target.closest('.tl-rs'))return;const p=e.touches[0];
    Drag.lp={x:p.clientX,y:p.clientY,tm:setTimeout(()=>{const l=Drag.lp;Drag.lp=null;if(l&&dragStart(b,'move',l.y)){Drag.touch=true;dragApply(l.x,l.y)}},330)}},{passive:true});
  M.addEventListener('touchmove',e=>{const p=e.touches[0];if(Drag.lp){if(Math.abs(p.clientX-Drag.lp.x)>9||Math.abs(p.clientY-Drag.lp.y)>9){clearTimeout(Drag.lp.tm);Drag.lp=null}return}
    if(Drag.on&&Drag.touch){e.preventDefault();dragMove(p.clientX,p.clientY)}},{passive:false});
  const tEnd=e=>{if(Drag.lp){clearTimeout(Drag.lp.tm);Drag.lp=null}if(Drag.on&&Drag.touch){Drag.touch=false;dragEnd(e.type==='touchcancel')}};
  M.addEventListener('touchend',tEnd);M.addEventListener('touchcancel',tEnd);
  M.addEventListener('contextmenu',e=>{if(e.target.closest('.tl-b'))e.preventDefault()});
  /* list rows: swipe right to delete, left to postpone */
  M.addEventListener('pointerdown',e=>Swipe.down(e));window.addEventListener('pointermove',e=>Swipe.move(e));window.addEventListener('pointerup',e=>Swipe.up(e));window.addEventListener('pointercancel',e=>Swipe.up(e));
  /* detail: drag around the ring to set progress */
  document.addEventListener('pointerdown',e=>{const r=e.target.closest('.dt-ring[data-drag]');if(!r)return;const t=byId(r.dataset.id);if(!t)return;e.preventDefault();
    const st={last:prog(t),p:null},pct=$('[data-live^="pc:"]',r),arc=$('.rg-p',r);
    const upd=ev=>{const b=r.getBoundingClientRect();let a=Math.atan2(ev.clientX-(b.left+b.width/2),-(ev.clientY-(b.top+b.height/2)))*180/Math.PI;if(a<0)a+=360;
      let p=Math.round(a/360*20)*5;if(st.last>=75&&p<=25)p=100;else if(st.last<=25&&p>=75)p=0;st.last=p;st.p=p;setRing(arc,p);if(pct)pct.textContent=N(p)};
    const up=()=>{r.removeEventListener('pointermove',upd);r.removeEventListener('pointerup',up);r.removeEventListener('pointercancel',up);if(st.p==null)return;pushUndo();
      if(st.p>=100){finishTask(t);vib(25);commit();afterFinish(t)}else{t.prog=st.p;touch(t);commit()}};
    try{r.setPointerCapture(e.pointerId)}catch(x){}upd(e);r.addEventListener('pointermove',upd);r.addEventListener('pointerup',up);r.addEventListener('pointercancel',up)});
  /* chart tooltips */
  document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el.dataset.tip,r.left+r.width/2,r.top)}else hideTip()});
  M.addEventListener('scroll',hideTip,{passive:true});
  window.addEventListener('resize',()=>Isl.fit());
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==UI.tab){UI.tab=h;render()}});
  window.addEventListener('pagehide',saveNow);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else{tick();render()}});
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('zen'))Clock.zen(false)});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
  try{new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Isl.fit())}

function init(){load();UI.date=today();UI.month=UI.date.slice(0,7);UI.view=VIEWS.some(v=>v[0]===S.set.view)?S.set.view:'list';
  const h=location.hash.slice(1);if(TABS.includes(h))UI.tab=h;
  if(!S.seeded&&!S.tasks.length){seedDemo();saveNow()}
  ensureSeries(addD(today(),21));applyTheme();
  $('#dock').innerHTML=`<button class="dk" data-a="tab" data-v="tasks">${ic('view_agenda')}<span>المهام</span></button><button class="dk" data-a="tab" data-v="clock">${ic('schedule')}<span>الساعة</span></button><button id="fab" data-a="newTask" aria-label="مهمة جديدة">${ic('add')}</button><button class="dk" data-a="tab" data-v="sound">${ic('headphones')}<span>الصوت</span></button><button class="dk" data-a="tab" data-v="stats">${ic('bar_chart')}<span>الإحصائيات</span></button>`;
  bind();Player.init();lastDay=today();lastMin=new Date().getMinutes();render();checkReminders();
  setInterval(tick,1000);Cap.init();Cloud.init();G.init();Nat.init()}
init();

</script>
