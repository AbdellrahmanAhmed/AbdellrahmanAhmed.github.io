/* layout idea: mobile-first one-screen planner. A floating black island on top, the day as a
   departure board (split-flap time tiles on every row), and a docked bar with a centre FAB. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
.i{width:1.25em;height:1.25em;fill:currentColor;flex:none;display:block}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.muted{color:var(--ink2)}
.hide{display:none!important}
[dir="ltr"]{unicode-bidi:isolate}

/* ---------- app shell ---------- */
#app{height:100%;max-width:920px;margin:0 auto;position:relative;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:58px 16px 112px;overscroll-behavior:contain;scrollbar-width:thin}
#topmask{position:absolute;top:0;inset-inline:0;height:51px;background:var(--bg);z-index:20;pointer-events:none}

/* ---------- island ---------- */
#isl{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:60;background:var(--isl);color:#fff;border-radius:22px;overflow:hidden;height:38px;width:210px;
  transition:width .5s cubic-bezier(.32,1.28,.44,1),height .5s cubic-bezier(.32,1.28,.44,1),border-radius .5s;box-shadow:0 0 0 1px rgba(255,255,255,.09),0 10px 28px rgba(0,0,0,.35)}
#isl-in{width:max-content;max-width:min(calc(100vw - 20px),400px);position:absolute;top:0;left:50%;transform:translateX(-50%)}
#isl-in.swap{animation:islSwap .42s ease both}
@keyframes islSwap{from{opacity:0;filter:blur(6px);transform:translateX(-50%) scale(.94)}to{opacity:1;filter:none;transform:translateX(-50%) scale(1)}}
.ic-row{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px 0 13px;font-size:13px;white-space:nowrap;cursor:pointer;width:100%}
.ic-row .ic-t{overflow:hidden;text-overflow:ellipsis;max-width:46vw;color:#f1f1f1;font-weight:500}
.ic-row .ic-s{color:#9aa0aa}
.ic-row .ic-tr{font:700 17px/1 var(--f-num);color:var(--isl-accent);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.ic-lead{width:22px;height:22px;display:grid;place-items:center;position:relative;color:var(--tc,#fff)}
.ic-lead .i{width:15px;height:15px}
.ic-lead svg.rg{position:absolute;inset:0;width:22px;height:22px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--isl-accent);border-radius:2px;height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}.eq i:nth-child(3){animation-delay:-.7s}.eq i:nth-child(4){animation-delay:-.15s}
.eq.off i{animation:none;height:25%}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.ia{display:flex;align-items:center;gap:11px;padding:11px 14px;min-height:56px;max-width:min(calc(100vw - 20px),400px);position:relative}
.ia-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:var(--tc,var(--isl-accent));flex:none}
.ia-tx{min-width:0;flex:1}
.ia-tx b{display:block;font-weight:600;font-size:13.5px;line-height:1.35;white-space:normal}
.ia-tx span{display:block;font-size:12px;color:#a7adb8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.ia-act{display:flex;gap:6px;flex:none}
.ia-act button{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.ia-act button:first-child{background:var(--isl-accent);color:#111}
.ia-bar{position:absolute;bottom:0;inset-inline:0;height:2px;background:var(--isl-accent);transform-origin:right;animation:iaBar linear both}
@keyframes iaBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ip{width:min(calc(100vw - 20px),380px);padding:14px;display:grid;gap:10px}
.ip-card{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;display:grid;gap:8px}
.ip-h{display:flex;align-items:center;gap:10px;min-width:0}
.ip-h b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ip-h small{color:#9aa0aa;font-size:12px}
.ip-time{font:700 34px/1 var(--f-num);color:var(--isl-accent);text-align:center;font-variant-numeric:tabular-nums}
.ip-btns{display:flex;gap:8px;justify-content:center}
.ip-btns button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 8px;font-size:13px;font-weight:600;color:#fff}
.ip-btns button.pri{background:var(--isl-accent);color:#111}
.ip-next{display:flex;align-items:center;gap:8px;font-size:13px;color:#d6d9df;padding:2px 4px}
.ip-next .ic-s{margin-inline-start:auto;color:#9aa0aa}
.ip-prog{height:4px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.ip-prog i{display:block;height:100%;background:var(--isl-accent);border-radius:9px}

/* ---------- dock ---------- */
#dock{position:absolute;bottom:10px;left:12px;right:12px;max-width:500px;margin:0 auto;height:62px;background:var(--card);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;box-shadow:var(--shadow);z-index:30}
#dock button.dk{display:grid;justify-items:center;gap:1px;font-size:10.5px;color:var(--ink3);padding:6px 0;font-weight:500}
#dock button.dk .i{width:23px;height:23px}
#dock button.dk.on{color:var(--ink)}
#dock button.dk.on .i{color:var(--accent-ink)}
#fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto;transform:translateY(-16px);box-shadow:0 0 0 6px var(--bg),0 8px 18px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .2s}
#fab:active{transform:translateY(-16px) scale(.93)}
#fab .i{width:30px;height:30px}
body.zen #dock,body.zen #topmask{display:none}

/* ---------- generic controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:13px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.dark{background:var(--flap);border-color:transparent;color:var(--flap-ink)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.blk{width:100%}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.ib:hover{background:var(--card2)}
.ib.on{color:var(--accent-ink)}
.ib .i{width:21px;height:21px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--ink2);white-space:nowrap;font-weight:500}
.chip .i{width:15px;height:15px}
.chip.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.chip.tc{border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.chip.tc.on{background:var(--tc);border-color:var(--tc);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 6px;border-radius:10px;font-size:12.5px;color:var(--ink2);font-weight:500;white-space:nowrap;min-width:0}
.seg button .i{width:17px;height:17px}
.seg button.on{background:var(--sel);color:var(--on-sel);font-weight:600}
.inp,.ta{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;min-width:0}
.inp:focus,.ta:focus{border-color:var(--accent-ink)}
.ta{resize:vertical;min-height:74px;line-height:1.6}
input[type="time"].inp,input[type="date"].inp{font-family:var(--f-body);font-variant-numeric:tabular-nums;text-align:center;padding-inline:8px}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.sw.on{background:var(--accent)}
.sw.on::after{inset-inline-start:21px}
input[type="range"]{accent-color:var(--accent);width:100%}
.lbl{font-size:12px;color:var(--ink2);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fld{display:grid;gap:0}
.rowx{display:flex;align-items:center;gap:10px}
.rowx>.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--ink3);line-height:1.5}
.banner{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 13%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.banner .grow{flex:1;min-width:0}
.banner.crit{background:color-mix(in srgb,var(--crit) 10%,var(--card));border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}

/* ---------- flap tiles (the signature) ---------- */
.flap{display:inline-grid;place-items:center;min-width:1.5em;padding:.24em .3em .18em;background:linear-gradient(var(--flap2) 0 50%,var(--flap) 50% 100%);color:var(--flap-ink);font:700 17px/1 var(--f-num);font-variant-numeric:tabular-nums;border-radius:5px;position:relative;letter-spacing:.03em}
.flap::after{content:"";position:absolute;inset-inline:0;top:calc(50% - .5px);height:1px;background:var(--flap-gap);opacity:.75}
.flaps{display:inline-flex;gap:2px;direction:ltr;align-items:center}
.flaps i{font:700 15px/1 var(--f-num);color:var(--ink3);font-style:normal;margin:0 -1px}

/* ---------- header ---------- */
.hd{display:grid;gap:10px;margin-bottom:12px}
.hd-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hd-date{min-width:0}
.hd-day{font:700 34px/1.15 var(--f-disp);letter-spacing:0}
.hd-sub{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hd-sub .today-pill{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 8px;font-weight:600;font-size:11.5px}
.hd-clock{display:flex;gap:4px;direction:ltr;--fw:44px;--fh:52px;--fs:38px;--fr:8px;flex:none}
.hd-sum{display:flex;align-items:center;gap:8px}
.hd-prog{flex:1;min-width:0;display:grid;gap:5px}
.hd-prog-t{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.hd-prog-t b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.wk-d{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;border-radius:13px;border:1px solid transparent;position:relative;color:var(--ink2)}
.wk-d small{font-size:11px}
.wk-d b{font:700 19px/1 var(--f-num)}
.wk-d .wk-p{width:18px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.wk-d .wk-p i{display:block;height:100%;background:var(--accent)}
.wk-d.today b{color:var(--accent-ink)}
.wk-d.sel{background:linear-gradient(var(--flap2) 0 50%,var(--flap) 50% 100%);color:var(--flap-ink)}
.wk-d.sel b{color:var(--flap-ink)}
.wk-d.sel::after{content:"";position:absolute;inset-inline:0;top:50%;height:1px;background:var(--flap-gap);opacity:.6}
.wk-d.sel .wk-p{background:rgba(255,255,255,.18);position:relative;z-index:1}
.vbar{position:sticky;top:-8px;z-index:15;background:var(--bg);padding:8px 0 8px;margin-top:-4px;display:flex;gap:8px;align-items:center}
.vbar .seg{flex:1;min-width:0}

/* ---------- board rows (list view) ---------- */
.sec-t{font-size:12px;color:var(--ink3);font-weight:600;margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:62px 38px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);position:relative;min-height:66px}
.row-time{display:grid;justify-items:center;gap:3px}
.row-time small{font-size:10.5px;color:var(--ink3);direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,var(--card));color:var(--tc)}
.row-ic .i{width:21px;height:21px}
.row-body{min-width:0;cursor:pointer}
.row-t{font-weight:600;font-size:14.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-m{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:11.5px;color:var(--ink2);margin-top:1px;align-items:center}
.row-m span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.row-m .i{width:13px;height:13px}
.row-pb{height:3px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;max-width:180px}
.row-pb i{display:block;height:100%;background:var(--tc);border-radius:3px}
.row-end{display:grid;justify-items:end;gap:4px}
.row-btns{display:flex;gap:2px;align-items:center}
.st{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--card2);color:var(--ink2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.st.s-run{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.st.s-run::before{background:var(--accent);animation:pulse 1.2s infinite}
.st.s-now::before{background:var(--warn)}
.st.s-late{color:var(--crit)}.st.s-late::before{background:var(--crit)}
.st.s-done{color:var(--good-ink)}.st.s-done::before{background:var(--good)}
.st.s-paused::before{background:var(--serious)}
@keyframes pulse{50%{opacity:.25}}
.rb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.rb .i{width:22px;height:22px}
.rb.play{color:var(--ink)}
.rb.chk{color:var(--ink3)}
.rb.chk.on{color:var(--good)}
.row.is-done .row-t{text-decoration:line-through;color:var(--ink3);font-weight:500}
.row.is-done .row-ic,.row.is-done .row-time{opacity:.5}
.row.is-run::before,.row.is-now::before{content:"";position:absolute;inset-block:8px;inset-inline-start:-16px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
[dir="rtl"] .row.is-run::before,[dir="rtl"] .row.is-now::before{border-radius:4px 0 0 4px}
.row.is-now::before{background:var(--warn)}
.pdm{width:7px;height:7px;border-radius:2px;background:var(--ink3);display:inline-block;transform:rotate(45deg)}
.pdm.p3{background:var(--crit)}.pdm.p2{background:var(--serious)}.pdm.p1{background:var(--c1)}
.empty{text-align:center;padding:40px 16px;color:var(--ink2);display:grid;gap:10px;justify-items:center}
.empty .i{width:44px;height:44px;color:var(--ink3)}
.empty b{font:700 20px var(--f-disp);color:var(--ink)}

/* ---------- circles view ---------- */
.dial{display:block;width:min(100%,272px);margin:0 auto 6px;touch-action:pan-y}
.dial text{font-family:var(--f-num);fill:var(--ink3);font-size:13px;font-weight:600}
.dial .d-pct{font-size:58px;font-weight:800;fill:var(--ink)}
.dial .d-sub{font-family:var(--f-body);font-size:12.5px;fill:var(--ink2);font-weight:500}
.dial .d-arc{cursor:pointer;transition:opacity .2s}
.circ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 8px;margin-top:10px}
.circ{display:grid;justify-items:center;gap:5px;text-align:center;padding:4px 2px;border-radius:16px;min-width:0}
.circ-r{position:relative;width:86px;height:86px;display:grid;place-items:center;color:var(--tc)}
.circ-r svg.rg{position:absolute;inset:0;width:100%;height:100%}
.circ-r .i{width:30px;height:30px}
.circ-r em{position:absolute;bottom:-4px;inset-inline-end:-4px;font:700 13px/1 var(--f-num);font-style:normal;background:var(--flap);color:var(--flap-ink);padding:3px 5px 2px;border-radius:6px}
.circ b{font-size:13px;font-weight:600;line-height:1.35;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ small{font-size:11px;color:var(--ink2);direction:ltr}
.circ.is-done b{color:var(--ink3);text-decoration:line-through}
.rg .rg-t{fill:none;stroke:color-mix(in srgb,var(--tc,var(--ink3)) 18%,var(--line))}
.rg .rg-p{fill:none;stroke:var(--tc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .5s}

/* ---------- timeline (day) ---------- */
.tl-tools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tl-tray{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tl{position:relative;display:grid;grid-template-columns:44px 1fr;gap:0 6px;--hh:56px;user-select:none;-webkit-user-select:none}
.tl-hours{position:relative;height:calc(var(--hh)*24)}
.tl-hours span{position:absolute;inset-inline-start:0;transform:translateY(-50%);font:600 13px/1 var(--f-num);color:var(--ink3);direction:ltr}
.tl-grid{position:relative;height:calc(var(--hh)*24);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% var(--hh),100% calc(var(--hh)/2);border-bottom:1px solid var(--line);cursor:cell}
.tl-b{position:absolute;border-radius:10px;background:color-mix(in srgb,var(--tc) 20%,var(--card));border-inline-start:4px solid var(--tc);padding:3px 8px;overflow:hidden;font-size:12.5px;line-height:1.3;cursor:grab;min-height:20px;display:flex;flex-direction:column;box-shadow:0 0 0 1.5px var(--bg);touch-action:pan-y}
.tl-b b{font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b b .i{width:14px;height:14px;color:var(--tc);flex:none}
.tl-b small{font-size:11px;color:var(--ink2);direction:ltr;text-align:end;font-variant-numeric:tabular-nums}
.tl-b.is-done{opacity:.55}
.tl-b.is-done b{text-decoration:line-through}
.tl-b.is-run{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3.5px var(--accent)}
.tl-b.is-open{border-end-end-radius:0;border-end-start-radius:0;border-bottom:2px dashed var(--tc)}
.tl-b.drag{z-index:9;cursor:grabbing;box-shadow:0 12px 30px rgba(0,0,0,.28),0 0 0 2px var(--tc);opacity:.96}
.tl-rs{position:absolute;inset-inline:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.tl-rs::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;border-radius:3px;background:var(--tc);opacity:.55;transform:translateX(-50%)}
.tl-now{position:absolute;inset-inline:-6px 0;height:2px;background:var(--crit);z-index:6;pointer-events:none}
.tl-now::before{content:"";position:absolute;inset-inline-start:-3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--crit)}
.tl-tip{position:fixed;z-index:80;background:var(--flap);color:var(--flap-ink);font:700 15px/1 var(--f-num);padding:6px 9px 5px;border-radius:8px;pointer-events:none;direction:ltr;transform:translate(-50%,-140%)}

/* ---------- week ---------- */
.wg{--hh:24px;display:grid;grid-template-columns:30px repeat(7,1fr);gap:0 3px}
.wg-hd{position:sticky;top:44px;background:var(--bg);z-index:8;display:grid;justify-items:center;padding:4px 0 6px;font-size:11px;color:var(--ink2);border-radius:10px}
.wg-hd b{font:700 17px/1.1 var(--f-num);color:var(--ink)}
.wg-hd.today b{color:var(--accent-ink)}
.wg-hrs{position:relative;height:calc(var(--hh)*24)}
.wg-hrs span{position:absolute;inset-inline-start:0;transform:translateY(-50%);font:600 11px/1 var(--f-num);color:var(--ink3)}
.wg-col{position:relative;height:calc(var(--hh)*24);background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% calc(var(--hh)*2);border-radius:6px;background-color:color-mix(in srgb,var(--card) 55%,transparent)}
.wg-col.today{background-color:color-mix(in srgb,var(--accent) 9%,var(--card))}
.wg-b{position:absolute;inset-inline:1px;border-radius:5px;background:var(--tc);min-height:5px;overflow:hidden;font-size:9.5px;line-height:1.25;color:#fff;padding:1px 3px;cursor:pointer;box-shadow:0 0 0 1px var(--bg)}
.wg-b.is-done{opacity:.4}
.wg-any{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* ---------- month ---------- */
.mo-hd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mo-c{aspect-ratio:1/1.08;border-radius:12px;background:var(--card);border:1px solid var(--line2);display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:5px 2px 4px;position:relative;min-width:0}
.mo-c b{font:700 17px/1 var(--f-num)}
.mo-c.out{opacity:.38}
.mo-c.today{border-color:var(--accent)}
.mo-c.today b{color:var(--accent-ink)}
.mo-c.sel{background:linear-gradient(var(--flap2) 0 50%,var(--flap) 50% 100%);color:var(--flap-ink);border-color:transparent}
.mo-c.sel b{color:var(--flap-ink)}
.mo-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-content:center;max-width:34px}
.mo-dots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.mo-dots i.d{opacity:.35}
.mo-c em{font:600 10px/1 var(--f-num);font-style:normal;color:var(--ink3)}
.mo-c.sel em{color:rgba(255,255,255,.6)}
.mo-c.full::after{content:"";position:absolute;top:4px;inset-inline-end:4px;width:6px;height:6px;border-radius:50%;background:var(--good)}

/* ---------- sheets ---------- */
#sheets{position:fixed;inset:0;z-index:100;pointer-events:none}
.sh-back{position:absolute;inset:0;background:rgba(6,8,10,.5);pointer-events:auto;animation:fade .2s both}
.sh{position:absolute;inset-inline:0;bottom:0;margin:0 auto;max-width:560px;max-height:93%;background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;pointer-events:auto;animation:shUp .3s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sh.out{animation:shDn .2s ease both}
.sh-back.out{animation:fade .2s reverse both}
.sh-grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0;flex:none}
.sh-hd{display:flex;align-items:center;gap:8px;padding:8px 16px 8px;flex:none}
.sh-hd h2{font:700 18px/1.4 var(--f-body);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bd{overflow-y:auto;padding:4px 16px 18px;display:grid;gap:16px;overscroll-behavior:contain;align-content:start}
.sh-ft{padding:10px 16px 14px;border-top:1px solid var(--line2);display:flex;gap:8px;flex:none}
.sh-ft .btn{flex:1}
@keyframes shUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes shDn{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:720px){.sh{bottom:auto;top:50%;border-radius:24px;transform:translateY(-50%);animation:shPop .25s ease both;max-height:88%}.sh.out{animation:fade .15s reverse both}.sh-grab{display:none}.sh-hd{padding-top:14px}
  @keyframes shPop{from{opacity:0;transform:translateY(-46%) scale(.97)}to{opacity:1;transform:translateY(-50%)}}}
.menu{display:grid;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;font-weight:500;font-size:14.5px}
.menu button:hover{background:var(--card2)}
.menu button .i{color:var(--ink2);width:22px;height:22px}
.menu button small{margin-inline-start:auto;color:var(--ink3);font-size:12px}
.menu button.danger,.menu button.danger .i{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:grid;justify-items:center;gap:5px;padding:12px 6px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:center}
.tile .i{width:22px;height:22px;color:var(--ink2)}
.tile small{font-weight:400;color:var(--ink3);font-size:11px}
.tile.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.tile.on .i{color:inherit}

/* ---------- editor ---------- */
.ed-top{display:flex;gap:10px;align-items:center}
.ed-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,var(--card));color:var(--tc);flex:none;border:1px dashed color-mix(in srgb,var(--tc) 50%,transparent)}
.ed-ic .i{width:27px;height:27px}
.ed-title{font-size:17px;font-weight:600;padding:12px}
.sw-row{display:flex;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;background:var(--tc);position:relative;flex:none}
.swatch.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--tc)}
.dchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.days{display:flex;gap:5px;margin-top:8px}
.days button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);text-align:center}
.days button.on{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.subs{display:grid;gap:4px}
.sub{display:flex;align-items:center;gap:8px;padding:5px 0}
.sub .rb{width:28px;height:28px}
.sub span{flex:1;min-width:0;font-size:14px}
.sub.d span{text-decoration:line-through;color:var(--ink3)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}

/* ---------- task detail ---------- */
.dt-hero{display:grid;justify-items:center;gap:10px}
.dt-ring{position:relative;width:176px;height:176px;display:grid;place-items:center;touch-action:none;cursor:pointer;color:var(--tc)}
.dt-ring svg.rg{position:absolute;inset:0;width:100%;height:100%}
.dt-ring .dt-c{display:grid;justify-items:center;gap:0;pointer-events:none}
.dt-ring .dt-pct{font:800 50px/1 var(--f-num);color:var(--ink)}
.dt-ring .dt-tm{font:600 17px/1.2 var(--f-num);color:var(--ink2);direction:ltr}
.dt-ring .dt-lb{font-size:11.5px;color:var(--ink3)}
.dt-btns{display:flex;gap:8px;width:100%}
.dt-btns .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kv dt{color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.kv dt .i{width:16px;height:16px}
.kv dd{margin:0;font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;text-align:end}
.kv input[type="time"]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font:inherit;width:auto}
.dt-acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.stars{display:flex;gap:4px;direction:ltr;justify-content:center}
.stars button{color:var(--line);padding:2px}
.stars button .i{width:34px;height:34px}
.stars button.on{color:var(--warn)}
.share-pre{white-space:pre-wrap;font-size:13.5px;line-height:1.7;min-height:210px}

/* ---------- icon picker ---------- */
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.icg button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;color:var(--ink2);background:var(--card2)}
.icg button .i{width:24px;height:24px}
.icg button.on{background:var(--accent);color:var(--on-accent)}

/* ---------- flip clock ---------- */
.fc-card{position:relative;width:var(--fw);height:var(--fh);font:800 var(--fs)/1 var(--f-num);font-variant-numeric:tabular-nums;perspective:calc(var(--fh)*4);flex:none;letter-spacing:.01em}
.fc-h{position:absolute;inset-inline:0;height:50%;overflow:hidden;background:var(--flap2);color:var(--flap-ink);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-h span{position:absolute;inset-inline:0;height:200%;display:grid;place-items:center;padding-top:.06em}
.fc-u{top:0;border-radius:var(--fr) var(--fr) 0 0;transform-origin:50% 100%}
.fc-u span{top:0}
.fc-d{bottom:0;border-radius:0 0 var(--fr) var(--fr);background:var(--flap);transform-origin:50% 0}
.fc-d span{bottom:0}
.fc-card::after{content:"";position:absolute;inset-inline:0;top:calc(50% - max(1px,var(--fh)*.008));height:max(2px,calc(var(--fh)*.016));background:var(--flap-gap);z-index:4}
.fc-f{visibility:hidden;z-index:3}
.fc-card.flip .fc-f{visibility:visible}
.fc-card.flip .fc-ft{animation:flipT .3s ease-in both}
.fc-card.flip .fc-fb{animation:flipB .3s .3s cubic-bezier(.2,1.5,.5,1) both}
@keyframes flipT{from{transform:rotateX(0)}to{transform:rotateX(-90deg);filter:brightness(.55)}}
@keyframes flipB{from{transform:rotateX(90deg);filter:brightness(1.3)}to{transform:rotateX(0)}}
.fc-tag{position:absolute;z-index:5;top:7%;left:7%;font:600 calc(var(--fs)*.11)/1 var(--f-body);color:var(--flap-ink);opacity:.7;letter-spacing:.04em}
.ck{display:grid;gap:16px;justify-items:center}
.ck .seg{width:100%;max-width:440px}
.ck-stage{width:100%;container-type:inline-size;display:grid;justify-items:center;gap:3cqw;padding:2cqw 0;cursor:pointer}
.ck-cards{display:flex;gap:3.5cqw;direction:ltr;align-items:flex-end;--fw:min(43cqw,300px);--fh:min(52cqw,360px);--fs:min(42cqw,290px);--fr:min(4cqw,26px)}
.ck-cards .fc-s{--fw:min(17cqw,120px);--fh:min(20cqw,140px);--fs:min(15cqw,104px);--fr:min(2cqw,12px)}
.ck-cards.three{--fw:min(34cqw,250px);--fh:min(42cqw,300px);--fs:min(33cqw,235px)}
.ck-date{font:500 15px var(--f-body);color:var(--ink2);text-align:center}
.ck-lbl{font:700 22px var(--f-disp);text-align:center}
.ck-ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px}
.ck-ctrl .btn{flex:1}
.ck-dots{display:flex;gap:6px;justify-content:center}
.ck-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.ck-dots i.on{background:var(--accent)}
.ck-box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.ck-amb{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ck-amb button{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.ck-amb button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
body.zen{background:#000}
body.zen #main{padding:0;display:grid;place-items:center;overflow:hidden}
body.zen .ck>*:not(.ck-stage):not(.ck-date){display:none}
body.zen .ck{width:100%;padding:0 4vw}
body.zen .ck-date{color:#8b8f97}
body.zen #isl{opacity:.0;pointer-events:none}
@media (orientation:landscape) and (max-height:560px){body.zen .ck-cards{--fw:min(40cqw,78vh);--fh:min(46cqw,86vh);--fs:min(38cqw,72vh)}body.zen .ck-cards.three{--fw:min(29cqw,70vh);--fh:min(34cqw,80vh);--fs:min(28cqw,64vh)}body.zen .ck-date{display:none}}

/* ---------- sound ---------- */
.pg-t{font:700 30px/1.2 var(--f-disp);margin-bottom:2px}
.pg-s{font-size:13px;color:var(--ink2);margin-bottom:14px}
.amb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.amb-t{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;display:grid;gap:8px}
.amb-t .rowx b{font-size:13.5px;font-weight:600}
.amb-t.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.amb-t.on .ib{background:var(--accent);color:var(--on-accent)}
.amb-t .ib{background:var(--card2)}
.pl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.pl-now{display:flex;gap:12px;align-items:center}
.pl-cov{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--flap2),var(--flap));display:grid;place-items:center;color:var(--accent);flex:none;overflow:hidden;background-size:cover;background-position:center}
.pl-cov .i{width:30px;height:30px}
.pl-meta{min-width:0;flex:1}
.pl-meta b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-meta span{font-size:12.5px;color:var(--ink2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-seek{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:600 13px var(--f-num);color:var(--ink2);direction:ltr}
.pl-ctl{display:flex;justify-content:center;align-items:center;gap:10px;direction:ltr}
.pl-ctl .ib.big{width:56px;height:56px;border-radius:50%;background:var(--flap);color:var(--flap-ink)}
.pl-ctl .ib.big .i{width:30px;height:30px}
.pl-list{display:grid;gap:2px;max-height:260px;overflow-y:auto}
.pl-it{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;font-size:13.5px;cursor:pointer}
.pl-it.on{background:var(--card2);font-weight:600}
.pl-it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-it small{color:var(--ink3);font:600 12px var(--f-num)}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:0}
.kpi small{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.kpi small .i{width:15px;height:15px}
.kpi b{font:800 34px/1.1 var(--f-num)}
.kpi span{font-size:11.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font:700 16px/1.4 var(--f-body);margin-bottom:2px}
.card .hint{margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line);position:relative}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default}
.col-b{width:min(24px,70%);border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--c1) 22%,var(--card));position:relative;display:flex;align-items:flex-end;min-height:2px}
.col-b i{display:block;width:100%;background:var(--c1);border-radius:4px 4px 0 0}
.col-v{font:700 13px var(--f-num);color:var(--ink2);margin-bottom:2px}
.cols-x{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--ink3);margin-top:5px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px}
.hb{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:8px 10px;align-items:center;font-size:13px}
.hb .hb-b{height:12px;border-radius:0 4px 4px 0;background:var(--tc);min-width:2px}
[dir="rtl"] .hb .hb-b{border-radius:4px 0 0 4px}
.hb .hb-v{font:700 14px var(--f-num);color:var(--ink2)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;direction:ltr;justify-content:start}
.heat i{width:15px;height:15px;border-radius:4px;background:var(--card2);border:1px solid var(--line2)}
.heat i.h1{background:var(--sq1);border-color:transparent}.heat i.h2{background:var(--sq2);border-color:transparent}.heat i.h3{background:var(--sq3);border-color:transparent}.heat i.h4{background:var(--sq4);border-color:transparent}
.tip{position:fixed;z-index:120;background:var(--flap);color:var(--flap-ink);font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;transform:translate(-50%,-115%);white-space:nowrap;box-shadow:var(--shadow)}
.rank{display:grid;gap:8px}
.rank div{display:flex;gap:10px;align-items:center;font-size:13.5px}
.rank div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank div b{font:700 15px var(--f-num);color:var(--ink2)}

/* ---------- settings ---------- */
.set-g{display:grid;gap:2px}
.set-g>h3{font:700 13px/1.4 var(--f-body);margin:10px 0 4px;color:var(--accent-ink);letter-spacing:.01em}
.set-r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);min-height:48px}
.set-r:last-child{border-bottom:0}
.set-r>div:first-child{flex:1;min-width:0}
.set-r b{font-weight:500;font-size:14px;display:block}
.set-r small{font-size:12px;color:var(--ink3);display:block;line-height:1.45}
.set-r select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:150px}
.set-r .seg{flex:none}
.acc-row{display:flex;gap:8px}
.acc{width:28px;height:28px;border-radius:50%;position:relative}
.acc.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor}
.dotst{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.dotst.ok{background:var(--good)}.dotst.bad{background:var(--crit)}.dotst.wait{background:var(--warn)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
@media (min-width:760px){#main{padding-inline:28px}.row.is-run::before,.row.is-now::before{inset-inline-start:-14px}.hd-day{font-size:42px}.hd-clock{--fw:58px;--fh:68px;--fs:50px}}
@media (max-width:359px){.row{grid-template-columns:56px 32px 1fr auto;gap:7px}.row-ic{width:32px;height:32px}.hd-day{font-size:29px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.hd-date{display:block;text-align:start;min-width:0}
.hd-day{display:block}
.wk{grid-template-columns:20px repeat(7,1fr) 20px}
.wk-nav{display:grid;place-items:center;color:var(--ink3);border-radius:10px}
#isl .rg .rg-t{stroke:rgba(255,255,255,.22)}
#isl .ip-next{cursor:pointer}
@media (max-width:430px){.vbar .seg .i{display:none}.ck .seg .i{display:none}}
.ck-cards.sec{--fw:min(36cqw,270px);--fh:min(45cqw,330px);--fs:min(35cqw,255px)}
.tip.hide,.tl-tip.hide{display:none}
a.btn{text-decoration:none}
a.ib{color:var(--ink2)}
select{font:inherit;color:inherit}
select.inp{padding:8px 10px}
.ck-box .rowx{cursor:pointer}
.kpi b{direction:ltr;text-align:start}
[dir="rtl"] .kpi b{text-align:right}
.set-r .seg button{padding:6px 12px}
.sh-bd>p{line-height:1.7}
.dk span{line-height:1.2}
#botmask{position:absolute;bottom:0;left:0;right:0;height:92px;background:linear-gradient(transparent,var(--bg) 62%);z-index:25;pointer-events:none}
body.zen #botmask{display:none}
#isl.al{z-index:130}
#view{position:relative}
.row{touch-action:pan-y}
.row.swiping{background:var(--bg);z-index:2;user-select:none;-webkit-user-select:none}
.row.sw-back{transition:transform .2s ease}
.sw-bg{position:absolute;left:-16px;right:-16px;direction:ltr;display:flex;align-items:center;gap:8px;padding:0 24px;color:#fff;font-weight:600;font-size:13.5px;opacity:.72;z-index:1}
.sw-bg .i{width:22px;height:22px}
.sw-bg.del{background:var(--crit);justify-content:flex-start}
.sw-bg.pp{background:var(--serious);justify-content:flex-end}
.sw-bg.far{opacity:1}

/* costs + money report */
.hd-cost{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer;vertical-align:bottom;margin-inline-start:6px;color:var(--ink2)}.hd-cost .i{width:14px;height:14px}
.sub.cost b{font:700 15px var(--f-num);min-width:52px;text-align:start}.sub.cost small{font-size:11.5px;color:var(--ink3);white-space:nowrap}.sub.cost span.na{color:var(--ink3)}
.inp.cost-a{width:92px;flex:none;text-align:center;font-family:var(--f-num);font-weight:700}
.inp.sub-c{width:74px;flex:none;padding:6px 8px;min-height:34px;text-align:center;font:700 15px var(--f-num)}.inp.sub-c::placeholder{font:400 12px var(--f-body)}
.fin-sum{display:flex;gap:10px;margin-bottom:14px}.fin-sum>div{flex:1;background:var(--card2);border-radius:12px;padding:8px 12px;display:grid}.fin-sum small{font-size:12px;color:var(--ink2)}.fin-sum b{font:800 26px/1.15 var(--f-num)}
/* split */
.lnk{color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;font:inherit;font-weight:500;padding:0;background:none;border:0;cursor:pointer}
.kv dd.wrap{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:400}
.dt-acts .tile{padding:12px 2px;font-size:12px;line-height:1.35;align-content:start}
.ver{text-align:center;margin-top:10px}

</style>
</head>

</div>
<div id="sheets"></div>

/* ================= mutations ================= */
function touch(t){t.u=Math.max(Date.now(),(t.u||0)+1,(S.del[t.id]||0)+1);if(t.demo)delete t.demo;IDXc=null}
function addTask(t){S.tasks.push(t);touch(t);return t}
function delTask(id){const i=S.tasks.findIndex(t=>t.id===id);if(i<0)return null;const t=S.tasks[i];S.tasks.splice(i,1);if(!t.demo)S.del[id]=Date.now();IDXc=null;return t}
const running=()=>S.tasks.find(t=>t.run&&!t.done);
function startTask(t){const r=running();if(r&&r!==t)pauseTask(r);if(t.done){t.done=false;t.doneAt=null;t.aE=null}
  t.run=Date.now();if(!t.aS)t.aS=t.run;
  if(t.mode==='dur'&&t.start==null){t.date=today();t.start=clamp(snapTo(nowMin(),5),0,1435)}

function pauseTask(t){if(!t.run)return;t.acc=(t.acc||0)+(Date.now()-t.run);t.run=null;touch(t)}
function finishTask(t){if(t.run)pauseTask(t);t.done=true;t.doneAt=Date.now();t.aE=t.doneAt;touch(t)}

function shiftAfter(date,fromMin,m,exceptId){const a=dayTasks(date).filter(t=>!t.done&&t.start!=null&&t.start>=fromMin&&t.id!==exceptId);a.forEach(t=>moveBy(t,m));return a.length}
function rippleDay(date){const a=dayTasks(date).filter(t=>t.start!=null&&!t.done);let end=-1,n=0;
  for(const t of a){const sp=span(t);if(sp.s<end){moveBy(t,end-sp.s);n++;if(t.date!==date)continue}end=Math.max(end,span(t).e)}return n}

function findSlot(date,len,from,exceptId){const sn=S.set.snap||15;let cur=Math.ceil((from||0)/sn)*sn;

const oldUndone=()=>{const td=today();return S.tasks.filter(t=>!t.done&&!t.demo&&t.date<td)};
function carryOver(){const td=today();const a=oldUndone();a.forEach(t=>{t.date=td;t.pp=(t.pp||0)+1;touch(t)});return a.length}

/* ---------- undo (one level, whole-list snapshot) ---------- */
function pushUndo(){UNDO=JSON.stringify({t:S.tasks,s:S.series})}
function undoApply(){if(!UNDO)return false;const o=JSON.parse(UNDO);UNDO=null;const now=Date.now();
  const cur=new Map(S.tasks.map(t=>[t.id,t])),old=new Set(o.t.map(t=>t.id));
  for(const t of o.t){const c=cur.get(t.id);if(!c||JSON.stringify(c)!==JSON.stringify(t))t.u=Math.max(now,(c?c.u:0)+1,(S.del[t.id]||0)+1)}
  for(const [id,c] of cur)if(!old.has(id)&&!c.demo)S.del[id]=now;
  for(const k in o.s){const c=S.series[k];if(!c||JSON.stringify(c)!==JSON.stringify(o.s[k]))o.s[k].u=now}
  S.tasks=o.t;S.series={...S.series,...o.s};IDXc=null;return true}

/* ================= recurring series (materialised, deterministic ids) ================= */
const TPL_KEYS=['title','icon','color','cat','pri','mode','start','end','dur','notes','rem','gcal'];
function matchRule(r,date){if(date<r.from||(r.until&&date>r.until))return false;const d=pd(date);
  if(r.type==='daily')return true;if(r.type==='days')return (r.days||[]).includes(d.getDay());
  if(r.type==='weekly')return d.getDay()===pd(r.from).getDay();if(r.type==='monthly')return d.getDate()===pd(r.from).getDate();return false}
const instId=(sid,date)=>sid+'_'+date.replace(/-/g,'');
function ensureSeries(through){let made=0;const ids=new Set(S.tasks.map(t=>t.id));
  for(const sid in S.series){const r=S.series[sid];if(!r||!r.tpl)continue;const g=S.gen[sid];
    let d=g&&g>=r.from?addD(g,1):r.from;const lim=r.until&&r.until<through?r.until:through;let guard=0;
    while(d<=lim&&guard++<1200){if(matchRule(r,d)){const id=instId(sid,d);
        if(!S.del[id]&&!ids.has(id)){S.tasks.push({...clone(r.tpl),id,date:d,rep:sid,prog:0,done:false,u:1,c:Date.now(),subs:(r.tpl.subs||[]).map(s=>({id:s.id,t:s.t,d:false}))});ids.add(id);made++}}
      d=addD(d,1)}
    if(!g||lim>g)S.gen[sid]=lim}
  if(made){IDXc=null;save()}return made}
function tplOf(t){const o={};TPL_KEYS.forEach(k=>o[k]=t[k]);o.subs=(t.subs||[]).map(s=>({id:s.id,t:s.t}));return o}
function makeSeries(t,rule){const sid=uid();S.series[sid]={id:sid,u:Date.now(),type:rule.type,days:rule.days||[],from:t.date,until:rule.until||null,tpl:tplOf(t)};
  t.id=instId(sid,t.date);t.rep=sid;S.gen[sid]=t.date;return sid}
function seriesFuture(sid,fromDate){return S.tasks.filter(t=>t.rep===sid&&t.date>=fromDate)}
function endSeries(sid,date,keepId){const r=S.series[sid];if(!r)return;r.until=addD(date,-1);r.u=Date.now();
  seriesFuture(sid,date).forEach(t=>{if(t.id!==keepId&&!t.done)delTask(t.id)})}
function applySeries(t){const r=S.series[t.rep];if(!r)return;r.tpl=tplOf(t);r.u=Date.now();
  seriesFuture(t.rep,t.date).forEach(x=>{if(x===t||x.done)return;TPL_KEYS.forEach(k=>x[k]=t[k]);
    const old=new Map((x.subs||[]).map(s=>[s.id,s]));x.subs=(t.subs||[]).map(s=>{const o=old.get(s.id),n={id:s.id,t:s.t,d:!!(o&&o.d)};if(o&&+o.c>0)n.c=o.c;return n});touch(x)})}

/* ================= quick-entry parser (Egyptian Arabic) ================= */
function parseQuick(str){
  let s=' '+String(str).replace(/[٠-٩]/g,d=>AR.indexOf(d))+' ';const out={};
  const cut=re=>{const m=s.match(re);if(m)s=s.replace(m[0],' ');return m};
  let m;
  if(cut(/\sبعد\s+بكر[ةه](?=\s)/))out.dd=2;else if(cut(/\s(بكر[ةه]|غدا|غدًا)(?=\s)/))out.dd=1;else if(cut(/\s(النهارد[ةه]|اليوم)(?=\s)/))out.dd=0;
  const ampm=(h,x)=>{h=+h;if(x){if(/^(م|pm|مساء|مساءً|بالليل|العصر|المغرب|العشا)/i.test(x)){if(h<12)h+=12}else if(/^(ص|am|الصبح|صباحا|صباحًا)/i.test(x)){if(h===12)h=0}else if(/الضهر|الظهر/.test(x)){if(h<5)h+=12}}else if(h>=1&&h<=6)h+=12;return h};
  const AP='(ص|م|am|pm|الصبح|بالليل|العصر|المغرب|العشا|الضهر|الظهر|صباحا|مساء)';
  if((m=cut(new RegExp('\\sمن\\s+(\\d{1,2})(?::(\\d{2}))?\\s*'+AP+'?\\s*(?:ل|لـ|إلى|الى|لحد|-)\\s*(\\d{1,2})(?::(\\d{2}))?\\s*'+AP+'?(?=\\s)','i')))){
    out.start=ampm(m[1],m[3])*60+(+m[2]||0);out.end=ampm(m[4],m[6]||m[3])*60+(+m[5]||0);if(out.end<=out.start)out.end+=720;if(out.end<=out.start)out.end=out.start+60}
  if((m=cut(/\sساع[ةه]\s+و\s?(نص|ربع|تلت)(?=\s)/)))out.dur=60+(m[1]==='نص'?30:m[1]==='ربع'?15:20);
  else if(cut(/\sساعتين\s+و\s?نص(?=\s)/))out.dur=150;
  else if(cut(/\sساعتين(?=\s)/))out.dur=120;
  else if((m=cut(/\s(نص|ربع|تلت)\s+ساع[ةه](?=\s)/)))out.dur=m[1]==='نص'?30:m[1]==='ربع'?15:20;
  else if((m=cut(/\s(\d+(?:\.\d+)?)\s*(ساعات|ساع[ةه]|س|hrs?|h)(?=\s)/i)))out.dur=Math.round(+m[1]*60);
  else if((m=cut(/\s(\d+)\s*(دقيق[ةه]|دقايق|دقائق|د|mins?|m)(?=\s)/i)))out.dur=+m[1];
  if(out.start==null){
    if((m=cut(new RegExp('\\s(?:الساع[ةه]\\s+)?(\\d{1,2}):(\\d{2})\\s*'+AP+'?(?=\\s)','i'))))out.start=ampm(m[1],m[3])*60+ +m[2];
    else if((m=cut(new RegExp('\\s(?:الساع[ةه]\\s+)?(\\d{1,2})\\s*'+AP+'(?=\\s)','i'))))out.start=ampm(m[1],m[2])*60;
    else if((m=cut(/\sالساع[ةه]\s+(\d{1,2})(?=\s)/)))out.start=ampm(m[1])*60;
  }
  if(out.dur==null&&cut(/\sساع[ةه](?=\s)/))out.dur=60;
  if(out.start!=null&&(out.start<0||out.start>=1440))delete out.start;
  out.title=s.replace(/\s+/g,' ').trim();
  out.any=out.start!=null||out.dur!=null||out.dd!=null;return out}

/* ================= split: the part that is done stays done, the rest continues later ================= */
const APP_VER='3.0',SPLIT_MAX=24*60;
const partsOf=t=>t.sp?S.tasks.filter(x=>x.sp===t.sp).sort((a,b)=>(a.spn||0)-(b.spn||0)):[];
const partLabel=t=>{if(!t.sp)return '';const n=partsOf(t).length;return 'جزء '+N(t.spn||1)+(n>1?' من '+N(n):'')};
/* how much of the plan is still left, in minutes (rounded to 5) */
function remainMin(t){const pl=plannedMin(t);if(!pl)return S.set.defDur;const el=elapsedMs(t)/60000,left=el>=1?pl-el:pl*(1-prog(t)/100);return Math.max(5,Math.round(left/5)*5)}
/* at = when the rest starts (ms), mins = how long the rest needs, why = the note explaining the split */
function splitTask(t,at,mins,why){const d=new Date(at),date=ymd(d),start=d.getHours()*60+d.getMinutes(),gid=t.sp||t.id,n=t.spn||1;
  mins=Math.max(5,Math.round(+mins)||S.set.defDur);why=String(why||'').trim().slice(0,200);
  const rest=Object.assign(newTask({date}),{title:t.title,icon:t.icon,color:t.color,cat:t.cat,pri:t.pri||0,notes:t.notes||'',gcal:!!t.gcal,rem:t.rem==null?0:t.rem,
    mode:t.mode==='dur'?'dur':t.mode==='range'?'range':'open',start,end:null,dur:null,subs:(t.subs||[]).filter(s=>!s.d).map(s=>({...s})),sp:gid,spn:n+1,spr:why,spf:t.id,pp:(t.pp||0)+1});
  if(rest.mode==='range')rest.end=start+mins;else if(rest.mode==='dur')rest.dur=mins;
  if(t.run)pauseTask(t);const el=elapsedMs(t)/60000;t.subs=(t.subs||[]).filter(s=>s.d);
  /* the done part keeps only the time it really took */
  if(t.mode==='range'&&t.start!=null){const nm=nowMin();if(t.date===today()&&nm>t.start&&nm<t.end)t.end=Math.max(t.start+5,nm);else if(el>=1&&el<t.end-t.start)t.end=t.start+Math.max(5,Math.round(el))}
  else if(t.mode==='dur'&&el>=1&&el<(t.dur||0))t.dur=Math.max(5,Math.round(el));
  t.sp=gid;t.spn=n;t.spr=why;finishTask(t);addTask(rest);return rest}

/* ================= costs: money spent on a task (its own lines) or on one of its steps ================= */
const latn=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/٫/g,'.').replace(/٬/g,',');
const fmtNum=v=>{const r=Math.round((+v||0)*100)/100;return N(r.toLocaleString('en-US',{maximumFractionDigits:2}))};
const fmtMoney=v=>fmtNum(v)+' '+S.set.cur;
const stepCost=t=>(t.subs||[]).reduce((s,x)=>s+(+x.c||0),0);
const costOf=t=>(t.costs||[]).reduce((s,c)=>s+(+c.a||0),0)+stepCost(t);
/* every money line of a task: steps first (in step order), then the task's own lines */
const costItems=t=>(t.subs||[]).filter(s=>+s.c>0).map(s=>({a:+s.c,n:s.t,step:true})).concat((t.costs||[]).filter(c=>+c.a>0).map(c=>({a:+c.a,n:c.n||'',step:false})));
const NUM_RE=/\d[\d,]*(?:\.\d+)?|\.\d+/;
function parseAmt(s){const m=latn(s).match(NUM_RE);if(!m)return 0;const v=parseFloat(m[0].replace(/,(?=\d{3}(?!\d))/g,'').replace(',','.'));return isFinite(v)&&v>0?Math.min(1e9,Math.round(v*100)/100):0}
/* free text like "50 بنزين" or "غدا ١٢٠ جنيه" → amount + what it was for */
function parseCost(txt){const s=latn(txt).trim(),m=s.match(NUM_RE);if(!m)return {a:0,n:s};
  const n=(s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)).replace(/(^|\s)(جنيه|جنية|ج\.م\.?|ج|ريال|درهم|دولار|يورو|egp|le|usd|sar|aed)(?=\s|$)/gi,' ').replace(/\s+/g,' ').trim();return {a:parseAmt(m[0]),n}}
function addCost(t,a,n,at){a=typeof a==='number'?(a>0?Math.round(a*100)/100:0):parseAmt(a);if(!t||!a)return null;
  const c={id:uid(),a,n:String(n||'').trim().slice(0,80),at:at||Date.now()};if(!Array.isArray(t.costs))t.costs=[];t.costs.push(c);touch(t);return c}
const nTasks=n=>n===1?'مهمة واحدة':n===2?'مهمتين':N(n)+(n<=10?' مهام':' مهمة');
const dayCost=d=>(idx().get(d)||[]).reduce((s,t)=>s+(t.demo?0:costOf(t)),0);
function finRange(p,base){base=base||today();
  if(p==='w'){const lo=weekStartOf(base),hi=addD(lo,6);return {lo,hi,label:dateShort(lo)+' – '+dateShort(hi)}}
  if(p==='m'){const d=pd(base),lo=ymd(new Date(d.getFullYear(),d.getMonth(),1));return {lo,hi:ymd(new Date(d.getFullYear(),d.getMonth()+1,0)),label:fmtD(lo,{month:'long',year:'numeric'})}}
  return {lo:base,hi:base,label:dayName(base)+' '+dateLong(base)}}
const finTasks=R=>S.tasks.filter(t=>!t.demo&&t.date>=R.lo&&t.date<=R.hi&&costOf(t)>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:cmpTask(a,b));
/* the money report: the period's tasks that cost something, each with its lines */
function finReport(p,base){const R=finRange(p,base),ts=finTasks(R),L=['💰 *تقرير مادي · '+R.label+'*'];
  if(!ts.length){L.push('مفيش تكاليف متسجلة على مهام الفترة دي.');return L.join('\n')}
  L.push('الإجمالي: '+fmtMoney(ts.reduce((s,t)=>s+costOf(t),0))+' · '+nTasks(ts.length));let day=null;
  for(const t of ts){if(t.date!==day){day=t.date;L.push('');if(p!=='d')L.push('📅 '+dayName(day)+' '+dateShort(day)+' · '+fmtMoney(ts.filter(x=>x.date===day).reduce((s,x)=>s+costOf(x),0)))}
    const it=costItems(t);L.push((t.done?'✅':t.run?'▶️':'⬜')+' '+t.title+' — '+fmtMoney(costOf(t)));if(it.length>1||it[0].n)it.forEach(c=>L.push('   • '+(c.n||'تكلفة')+': '+fmtMoney(c.a)))}
  const bc=new Map();ts.forEach(t=>{const k=t.cat||'_';bc.set(k,(bc.get(k)||0)+costOf(t))});
  if(bc.size>1){L.push('','📁 حسب التصنيف:');[...bc].sort((a,b)=>b[1]-a[1]).forEach(c=>{const o=catById(c[0]);L.push('• '+(o?o.n:'بدون تصنيف')+': '+fmtMoney(c[1]))})}
  return L.join('\n')}

/* ================= share text ================= */
const STARS=n=>'⭐'.repeat(n||0);
function shareText(t){const L=[];const sp=span(t),pl=plannedMin(t),st=status(t);

function dayReport(date){const a=dayTasks(date),ds=dayStats(date);const L=['🗓 *تقرير '+dayName(date)+' '+dateLong(date)+'*','✅ '+N(ds.done)+' من '+N(ds.n)+' مهام · '+N(ds.pct)+'%',''];
  a.forEach(t=>{const sp=span(t);L.push((t.done?'✅':t.run?'▶️':'⬜')+' '+(sp?fmtT(sp.s)+' ':'')+t.title+(t.sp?' ['+partLabel(t)+']':'')+(t.done?'':' ('+N(prog(t))+'%)')+(t.fb&&t.fb.r?' '+STARS(t.fb.r):'')+(costOf(t)?' · 💰 '+fmtMoney(costOf(t)):''))});
  const tr=a.reduce((s,t)=>s+elapsedMs(t),0),cs=a.reduce((s,t)=>s+costOf(t),0);if(tr>59000||cs)L.push('');if(tr>59000)L.push('⏱ إجمالي وقت الشغل: '+fmtDur(tr/60000));if(cs)L.push('💰 مصاريف اليوم: '+fmtMoney(cs));return L.join('\n')}

function ring(p,sz,sw,id){const r=(sz-sw)/2,c=2*Math.PI*r,h=sz/2;
  return `<svg class="rg" viewBox="0 0 ${sz} ${sz}"><circle class="rg-t" cx="${h}" cy="${h}" r="${r}" stroke-width="${sw}"/><circle class="rg-p" ${id?`data-ring="${id}"`:''} data-c="${c.toFixed(2)}" cx="${h}" cy="${h}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(2)}" transform="rotate(-90 ${h} ${h})" style="opacity:${p>0?1:0}"/></svg>`}
function setRing(el,p){const c=+el.dataset.c;el.style.strokeDashoffset=(c*(1-p/100)).toFixed(2);el.style.opacity=p>0?1:0}
function fcard(k,v,cls){return `<div class="fc-card ${cls||''}" data-fc="${k}" data-v="${v}"><div class="fc-h fc-u"><span>${v}</span></div><div class="fc-h fc-d"><span>${v}</span></div><div class="fc-h fc-u fc-f fc-ft"><span>${v}</span></div><div class="fc-h fc-d fc-f fc-fb"><span>${v}</span></div></div>`}
const noMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function setFlip(card,v){if(!card||card.dataset.v===v)return;const old=card.dataset.v;card.dataset.v=v;const h=card.children;
  h[0].firstChild.textContent=v;h[2].firstChild.textContent=old;h[3].firstChild.textContent=v;
  if(noMotion()||document.hidden){h[1].firstChild.textContent=v;return}
  card.classList.remove('flip');void card.offsetWidth;card.classList.add('flip');clearTimeout(card._t);
  card._t=setTimeout(()=>{h[1].firstChild.textContent=v;card.classList.remove('flip')},620);
  if(S.set.tick&&UI.tab==='clock')Snd.flip()}
function timerText(t){if(t.done){const e=elapsedMs(t);return e>999?fmtClock(e):''}const r=remainMs(t);if(r==null)return fmtClock(elapsedMs(t));return r>=0?fmtClock(r):'+'+fmtClock(-r)}
function nextUp(){const n=nowMin();return dayTasks(today()).find(t=>!t.done&&!t.run&&t.start!=null&&(t.start>n||status(t)==='now'))}

const Sheets=[];
function openSheet(o){const back=document.createElement('div');back.className='sh-back';back.dataset.a='shClose';
  const el=document.createElement('div');el.className='sh '+(o.cls||'');el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="sh-grab"></div><div class="sh-hd"><h2></h2><span class="sh-x rowx"></span><button class="ib" data-a="shClose" aria-label="إغلاق">${ic('close')}</button></div><div class="sh-bd"></div><div class="sh-ft"></div>`;
  $('#sheets').append(back,el);const sh=Object.assign(o,{el,back});Sheets.push(sh);drawSheet(sh,true);return sh}
function drawSheet(sh,force){const ae=document.activeElement;
  if(!force&&ae&&sh.el.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.type!=='range')return;
  $('h2',sh.el).textContent=typeof sh.title==='function'?sh.title():(sh.title||'');
  $('.sh-x',sh.el).innerHTML=sh.head?sh.head():'';
  const bd=$('.sh-bd',sh.el),st=bd.scrollTop;bd.innerHTML=sh.body();bd.scrollTop=st;
  const ft=$('.sh-ft',sh.el),f=sh.foot?sh.foot():'';ft.innerHTML=f;ft.classList.toggle('hide',!f)}
function closeSheet(sh){sh=sh||Sheets[Sheets.length-1];if(!sh)return;const i=Sheets.indexOf(sh);if(i<0)return;Sheets.splice(i,1);
  sh.el.classList.add('out');sh.back.classList.add('out');setTimeout(()=>{sh.el.remove();sh.back.remove()},210);if(sh.onClose)sh.onClose()}
const closeAll=()=>{while(Sheets.length)closeSheet()};
const topSheet=()=>Sheets[Sheets.length-1];
const redrawSheets=()=>Sheets.forEach(sh=>{if(sh.live)drawSheet(sh)});
const redrawTop=()=>{const s=topSheet();if(s)drawSheet(s,true)};

function confirmSheet(title,text,btns){const sh=openSheet({title,body:()=>`<p class="muted">${esc(text)}</p>`,foot:()=>btns.map((b,i)=>`<button class="btn ${b.c||''}" data-a="cfm" data-v="${i}">${esc(b.l)}</button>`).join('')});sh.btns=btns}
A.cfm=el=>{const sh=topSheet(),b=sh.btns[+el.dataset.v];closeSheet(sh);if(b.fn)b.fn()};

/* ---------- the island ---------- */
const EQ='<span class="eq"><i></i><i></i><i></i><i></i></span>';
const Isl={open:false,al:null,q:[],tm:0,key:'',html:'',
  draw(){const inn=$('#isl-in');if(!inn)return;let key,html;
    if(this.al){key='a'+this.al.k;html=this.alertHTML(this.al)}
    else if(this.open){key='open';html=this.panelHTML()}
    else{const r=running(),mp=Player.playing(),nx=nextUp();key='c'+(r?r.id:'')+(mp?'m'+Player.idx:'')+(nx?nx.id:'')+(Nat.extOn()?'x'+Nat.ext.title:'');html=this.compactHTML(r,mp,nx)}
    if(key!==this.key){inn.classList.remove('swap');void inn.offsetWidth;inn.classList.add('swap')}
    if(html!==this.html){inn.innerHTML=html;this.html=html}
    this.key=key;$('#isl').classList.toggle('al',!!this.al);this.fit();natAudio()},
  fit(){const inn=$('#isl-in'),el=$('#isl');const w=Math.ceil(inn.offsetWidth),h=Math.ceil(inn.offsetHeight);if(!w)return;
    el.style.width=w+'px';el.style.height=h+'px';el.style.borderRadius=(h<=46?h/2:26)+'px'},
  compactHTML(r,mp,nx){
    if(r)return `<div class="ic-row" data-a="islToggle" style="--tc:var(--c${r.color})"><span class="ic-lead">${ring(prog(r),22,2.5,r.id)}${ic(r.icon)}</span><span class="ic-t">${esc(r.title)}</span>${mp||Nat.extOn()?EQ:''}<span class="ic-tr" dir="ltr" data-live="tm:${r.id}">${timerText(r)}</span></div>`;
    if(mp){const tr=Player.cur();return `<div class="ic-row" data-a="islToggle">${EQ}<span class="ic-t">${esc(tr.title)}</span>${tr.artist?`<span class="ic-s">${esc(tr.artist)}</span>`:''}</div>`}
    if(Nat.extOn())return `<div class="ic-row" data-a="islToggle">${EQ}<span class="ic-t">${esc(Nat.ext.title)}</span>${Nat.ext.artist?`<span class="ic-s">${esc(Nat.ext.artist)}</span>`:''}</div>`;
    if(nx)return `<div class="ic-row" data-a="islToggle" style="--tc:var(--c${nx.color})"><span class="ic-lead">${ic(nx.icon)}</span><span class="ic-t">${esc(nx.title)}</span><span class="ic-s">${stLabel(nx)}</span></div>`;
    const ds=dayStats(today());
    return `<div class="ic-row" data-a="islToggle"><span class="ic-lead">${ic(ds.n&&ds.done===ds.n?'task_alt':'event_available')}</span><span class="ic-t">${!ds.n?'يومك فاضي':ds.done===ds.n?'خلصت مهام اليوم':N(ds.n-ds.done)+' مهام باقية'}</span></div>`},
  alertHTML(a){const col=a.color==='good'?'var(--good)':a.color==='crit'?'#ff6b5e':a.color?`var(--c${a.color})`:'';
    return `<div class="ia" ${col?`style="--tc:${col}"`:''}><span class="ia-ic">${ic(a.icon||'notifications')}</span><div class="ia-tx" data-a="islDismiss"><b>${esc(a.title)}</b>${a.sub?`<span>${esc(a.sub)}</span>`:''}</div>
      ${a.actions&&a.actions.length?`<div class="ia-act">${a.actions.map((b,i)=>`<button data-a="islAct" data-v="${i}">${esc(b.l)}</button>`).join('')}</div>`:''}<i class="ia-bar" style="animation-duration:${a.ttl||4200}ms"></i></div>`},
  panelHTML(){const r=running(),tr=Player.cur(),td=today();let h='<div class="ip">';
    if(r){const p=prog(r);h+=`<div class="ip-card" style="--tc:var(--c${r.color})"><div class="ip-h"><span class="ic-lead">${ic(r.icon)}</span><b>${esc(r.title)}</b><small>${timeText(r)}</small></div>
      <div class="ip-time" dir="ltr" data-live="tm:${r.id}">${timerText(r)}</div><div class="ip-prog"><i style="width:${p}%"></i></div>
      <div class="ip-btns"><button data-a="tPause" data-id="${r.id}" aria-label="إيقاف مؤقت">${ic('pause')}إيقاف</button><button data-a="costQuick" data-id="${r.id}">${ic('payments')}تكلفة</button><button class="pri" data-a="tDone" data-id="${r.id}">${ic('check')}خلصت</button></div></div>`}
    if(tr){h+=`<div class="ip-card"><div class="ip-h">${Player.playing()?EQ:ic('music_note')}<b>${esc(tr.title)}</b><small>${esc(tr.artist||'')}</small></div>
      <div class="ip-btns" dir="ltr"><button data-a="plPrev" aria-label="السابق">${ic('skip_previous')}</button><button class="pri" data-a="plToggle" aria-label="تشغيل">${ic(Player.playing()?'pause':'play_arrow')}</button><button data-a="plNext" aria-label="التالي">${ic('skip_next')}</button></div></div>`}
    h+=Nat.extCard(true);
    const up=dayTasks(td).filter(t=>!t.done&&!t.run).slice(0,3);
    if(up.length)h+='<div>'+up.map(t=>`<div class="ip-next" data-a="open" data-id="${t.id}" style="--tc:var(--c${t.color})"><span class="ic-lead">${ic(t.icon)}</span><span class="ic-t">${esc(t.title)}</span><span class="ic-s">${t.start!=null?fmtT(t.start):stLabel(t)}</span></div>`).join('')+'</div>';
    else if(!r)h+=`<div class="ip-next"><span class="ic-t">مفيش مهام جاية النهارده</span></div>`;
    h+=`<div class="ip-btns"><button data-a="newTask">${ic('add')}مهمة</button><button data-a="focusNow">${ic('timelapse')}تركيز ${N(S.ck.focus)} د</button><button data-a="tab" data-v="sound">${ic('headphones')}صوت</button></div></div>`;return h},
  notify(o){o.k=uid();this.q.push(o);if(this.q.length>4)this.q.shift();if(!this.al)this.next()},
  next(){clearTimeout(this.tm);this.al=this.q.shift()||null;this.open=false;this.draw();if(this.al)this.tm=setTimeout(()=>this.next(),this.al.ttl||4200)},
  say(title,icon,sub){this.notify({title,icon:icon||'check',sub,ttl:2600})}
};

/* ---------- confetti (one small celebration when the day is complete) ---------- */
function confetti(){if(noMotion())return;const cv=$('#fx');const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),cols=[1,2,3,4,5,7].map(i=>cs.getPropertyValue('--c'+i).trim());
  const ps=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let n=0;(function f(){g.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-n/110);g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});
    if(++n<115)requestAnimationFrame(f);else g.clearRect(0,0,innerWidth,innerHeight)})()}

function copyText(txt,okMsg){const done=()=>Isl.say(okMsg||'اتنسخ','content_copy');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();ok?done():Isl.notify({icon:'warning',title:'النسخ مش متاح هنا',sub:'حدد النص وانسخه يدوي',color:'crit'})};
  try{navigator.clipboard.writeText(txt).then(done,fb)}catch(e){fb()}}

function weekStrip(){const ws=weekStartOf(UI.date),td=today();let h=`<div class="wk"><button class="wk-nav" data-a="navBy" data-v="-7" aria-label="الأسبوع السابق">${ic('chevron_right')}</button>`;

/* ---------- rows (shared by list / month / search) ---------- */
function rowHTML(t,showDate){const st=status(t),p=prog(t),sp=span(t),c=catById(t.cat),pl=plannedMin(t);
  const tm=sp?flaps(sp.s)+`<small>${t.mode==='open'?(t.aE?'→ '+fmtT(sp.e):'مفتوحة'):'→ '+fmtT(sp.e)}</small>`
    :t.mode==='dur'?`<span class="flap">${N(t.dur||0)}′</span><small>مدة</small>`:`<span class="flap">∞</span><small>أي وقت</small>`;
  const m=[];
  if(showDate)m.push(`<span>${ic('event')}${relDay(t.date)}</span>`);
  if(t.pri)m.push(`<span><i class="pdm p${t.pri}"></i></span>`);
  if(pl)m.push(`<span>${fmtDur(pl)}</span>`);
  if(c)m.push(`<span>${esc(c.n)}</span>`);
  if(t.subs&&t.subs.length)m.push(`<span>${ic('checklist')}${N(t.subs.filter(s=>s.d).length)}/${N(t.subs.length)}</span>`);
  if(t.sp)m.push(`<span>${ic('call_split')}${partLabel(t)}</span>`);
  if(t.rep)m.push(`<span>${ic('repeat')}</span>`);
  if(t.gcal&&t.gid)m.push(`<span>${ic('event_available')}</span>`);
  if(t.pp)m.push(`<span>${ic('snooze')}${N(t.pp)}</span>`);
  if(t.fb&&t.fb.r)m.push(`<span>${ic('star')}${N(t.fb.r)}</span>`);
  if(costOf(t))m.push(`<span>${ic('payments')}${fmtNum(costOf(t))}</span>`);
  if(t.run||t.acc)m.push(`<span dir="ltr" class="num" data-live="el:${t.id}">${fmtClock(elapsedMs(t))}</span>`);
  return `<div class="row is-${st}" style="--tc:var(--c${t.color})" data-row="${t.id}">
    <button class="row-time" data-a="open" data-id="${t.id}" aria-label="تفاصيل">${tm}</button>
    <span class="row-ic">${ic(t.icon)}</span>
    <div class="row-body" data-a="open" data-id="${t.id}"><div class="row-t">${esc(t.title)}</div><div class="row-m">${m.join('')}</div>${p>0&&p<100?`<div class="row-pb"><i data-bar="${t.id}" style="width:${p}%"></i></div>`:''}</div>
    <div class="row-end"><span class="st s-${st}">${stLabel(t,st)}</span><div class="row-btns">${t.done?'':`<button class="rb play" data-a="tToggle" data-id="${t.id}" aria-label="${t.run?'إيقاف مؤقت':'ابدأ'}">${ic(t.run?'pause':'play_arrow')}</button>`}<button class="rb chk ${t.done?'on':''}" data-a="tDone" data-id="${t.id}" aria-label="${t.done?'إعادة فتح':'خلصت'}">${ic(t.done?'check_circle':'radio_button_unchecked')}</button></div></div></div>`}
function emptyHTML(d){return `<div class="empty">${ic('event_available')}<b>${d===today()?'يومك لسه فاضي':'مفيش مهام في اليوم ده'}</b><span>دوس على + واكتب مثلًا: «مذاكرة 9:30 ساعة ونص»</span><button class="btn pri" data-a="newTask">${ic('add')}مهمة جديدة</button></div>`}
function filtered(d){let a=dayTasks(d);if(UI.filter)a=a.filter(t=>t.cat===UI.filter);if(S.set.hideDone)a=a.filter(t=>!t.done);return a}

function listView(){const d=UI.date,all=dayTasks(d);if(!all.length)return emptyHTML(d);
  const cats=[...new Set(all.map(t=>t.cat).filter(Boolean))].map(catById).filter(Boolean);let h='';
  if(cats.length>1)h+=`<div class="chips scroll" style="margin-bottom:4px"><button class="chip ${UI.filter?'':'on'}" data-a="filter" data-v="">الكل</button>${cats.map(c=>`<button class="chip tc ${UI.filter===c.id?'on':''}" style="--tc:var(--c${c.c})" data-a="filter" data-v="${c.id}">${ic(c.i)}${esc(c.n)}</button>`).join('')}</div>`;
  const a=filtered(d),timed=a.filter(t=>t.start!=null),free=a.filter(t=>t.start==null);
  h+=timed.map(t=>rowHTML(t)).join('');
  if(free.length)h+=`<div class="sec-t">بدون وقت محدد</div>`+free.map(t=>rowHTML(t)).join('');
  if(!a.length)h+=`<div class="empty"><span>كل المهام هنا مخفية بالفلتر.</span></div>`;
  return h}

/* ---------- circles: a 24h dial of the day + one progress ring per task ---------- */
const polar=(r,a)=>{const k=(a-90)*Math.PI/180;return [160+r*Math.cos(k),160+r*Math.sin(k)]};
function arcPath(r,a0,a1){const p0=polar(r,a0),p1=polar(r,a1);return `M${p0[0].toFixed(2)} ${p0[1].toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${p1[0].toFixed(2)} ${p1[1].toFixed(2)}`}
function dialHTML(a,date){const ds=dayStats(date);let s=`<svg class="dial" viewBox="0 0 320 320" role="img" aria-label="توزيع مهام اليوم على ٢٤ ساعة">`;
  for(let h=0;h<24;h++){const big=h%6===0,p0=polar(big?147:151,h*15),p1=polar(156,h*15);
    s+=`<line x1="${p0[0].toFixed(1)}" y1="${p0[1].toFixed(1)}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="var(--${big?'ink3':'line'})" stroke-width="${big?2:1.5}" stroke-linecap="round"/>`;
    if(big){const p=polar(135,h*15);s+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+4.5).toFixed(1)}" text-anchor="middle">${N(pad(h))}</text>`}}
  const items=a.filter(t=>span(t)).map(t=>({t,...span(t)})).sort((x,y)=>x.s-y.s);let e0=-1,e1=-1,two=false;
  items.forEach(it=>{if(it.s>=e0){it.l=0;e0=it.e}else if(it.s>=e1){it.l=1;e1=it.e;two=true}else{it.l=0;e0=Math.max(e0,it.e)}});
  s+=`<circle cx="160" cy="160" r="116" fill="none" stroke="var(--line2)" stroke-width="13"/>`;
  if(two)s+=`<circle cx="160" cy="160" r="100" fill="none" stroke="var(--line2)" stroke-width="13"/>`;
  items.forEach(it=>{const a0=it.s/4+.7,a1=Math.max(Math.min(it.e,1440)/4-.7,a0+2.2),st=status(it.t);
    s+=`<path class="d-arc" d="${arcPath(it.l?100:116,a0,a1)}" fill="none" stroke="var(--c${it.t.color})" stroke-width="13" opacity="${it.t.done?1:st==='run'?1:.45}" data-a="open" data-id="${it.t.id}"><title>${esc(it.t.title)} ${fmtT(it.s)}–${fmtT(it.e)}</title></path>`});
  if(date===today()){const ang=nowMin()/4,p0=polar(84,ang),p1=polar(158,ang);
    s+=`<g id="dial-now"><line x1="${p0[0].toFixed(1)}" y1="${p0[1].toFixed(1)}" x2="${p1[0].toFixed(1)}" y2="${p1[1].toFixed(1)}" stroke="var(--crit)" stroke-width="2" stroke-linecap="round"/><circle cx="${p1[0].toFixed(1)}" cy="${p1[1].toFixed(1)}" r="4" fill="var(--crit)"/></g>`}
  s+=`<text class="d-pct" x="160" y="174" text-anchor="middle">${N(ds.pct)}%</text><text class="d-sub" x="160" y="197" text-anchor="middle">${N(ds.done)} من ${N(ds.n)} مهام</text></svg>`;return s}
function circlesView(){const d=UI.date,a=filtered(d);if(!dayTasks(d).length)return emptyHTML(d);
  return dialHTML(a,d)+`<div class="circ-grid">${a.map(t=>{const p=prog(t),sp=span(t),st=status(t);
    return `<button class="circ is-${st}" style="--tc:var(--c${t.color})" data-a="open" data-id="${t.id}"><span class="circ-r">${ring(p,86,7,t.id)}${ic(t.done?'check':t.icon)}<em data-live="pc:${t.id}">${N(p)}</em></span><b>${esc(t.title)}</b><small>${sp?fmtT(sp.s):t.mode==='dur'?N(t.dur)+'′':'—'} · ${stLabel(t,st)}</small></button>`}).join('')}</div>`}

/* ---------- day timeline (drag to move, pull the bottom edge to resize) ---------- */
function layoutCols(items){let cols=[],group=[],gEnd=-1;const flush=()=>{group.forEach(g=>g.n=cols.length);group=[];cols=[];gEnd=-1};
  for(const it of items){if(group.length&&it.s>=gEnd)flush();let c=cols.findIndex(e=>e<=it.s);if(c<0){c=cols.length;cols.push(it.ve)}else cols[c]=it.ve;it.c=c;group.push(it);gEnd=Math.max(gEnd,it.ve)}flush()}
function dayView(){const d=UI.date,hh=S.set.hh,a=filtered(d);
  const items=a.filter(t=>span(t)).map(t=>{const sp=span(t);return {t,s:sp.s,e:Math.min(sp.e,1440),ve:Math.max(Math.min(sp.e,1440),sp.s+22/hh*60),open:sp.open}}).sort((x,y)=>x.s-y.s);
  layoutCols(items);const free=a.filter(t=>t.start==null);
  let h=`<div class="tl-tools"><button class="chip ${S.set.ripple?'on':''}" data-a="ripple">${ic('fast_forward')}إزاحة تلقائية</button><button class="chip" data-a="shiftDay">${ic('swap_vert')}إزاحة الباقي</button>
    <span style="flex:1"></span><button class="ib" data-a="zoom" data-v="-1" aria-label="تصغير">${ic('zoom_out')}</button><button class="ib" data-a="zoom" data-v="1" aria-label="تكبير">${ic('zoom_in')}</button></div>`;
  if(free.length)h+=`<div class="tl-tray">${free.map(t=>`<button class="chip tc ${t.done?'':'on'}" style="--tc:var(--c${t.color})" data-a="open" data-id="${t.id}">${ic(t.done?'check':t.icon)}${esc(t.title)}${t.mode==='dur'?' · '+fmtDur(t.dur):''}</button>`).join('')}</div>`;
  h+=`<div class="tl" style="--hh:${hh}px"><div class="tl-hours">${Array.from({length:25},(_,i)=>`<span style="top:${i*hh}px">${i<24?fmtT(i*60).replace(/ [صم]$/,''):''}</span>`).join('')}</div><div class="tl-grid" data-a="tlTap">`;
  items.forEach(it=>{const t=it.t,st=status(t),top=it.s/60*hh,ht=Math.max(20,(it.e-it.s)/60*hh),w=100/it.n;
    h+=`<div class="tl-b is-${st} ${it.open?'is-open':''}" data-id="${t.id}" data-a="open" style="--tc:var(--c${t.color});top:${top.toFixed(1)}px;height:${ht.toFixed(1)}px;inset-inline-start:calc(${(it.c*w).toFixed(2)}% + 1px);width:calc(${w.toFixed(2)}% - 3px)"><b>${ic(t.done?'check':t.icon)}${esc(t.title)}</b>${ht>=38?`<small>${fmtT(it.s)}–${it.open?'…':fmtT(it.e)}</small>`:''}${t.mode==='open'||t.done?'':'<i class="tl-rs"></i>'}</div>`});
  if(d===today())h+=`<div class="tl-now" id="tl-now" style="top:${(nowMin()/60*hh).toFixed(1)}px"></div>`;
  return h+'</div></div>'}

/* ---------- week ---------- */
function weekView(){const ws=weekStartOf(UI.date),hh=24,td=today(),days=Array.from({length:7},(_,i)=>addD(ws,i));
  let h='<div class="wg"><span></span>'+days.map(d=>`<button class="wg-hd ${d===td?'today':''}" data-a="goDay" data-v="${d}"><span>${DOW[pd(d).getDay()]}</span><b>${N(pd(d).getDate())}</b></button>`).join('');
  h+='<div class="wg-hrs">'+[0,3,6,9,12,15,18,21].map(i=>`<span style="top:${i*hh+(i?0:6)}px">${N(pad(i))}</span>`).join('')+'</div>';
  days.forEach(d=>{const items=dayTasks(d).filter(t=>span(t)).map(t=>({t,...span(t)}));
    h+=`<div class="wg-col ${d===td?'today':''}" data-a="goDay" data-v="${d}">`+items.map(it=>`<div class="wg-b ${it.t.done?'is-done':''}" data-a="open" data-id="${it.t.id}" style="--tc:var(--c${it.t.color});top:${(it.s/60*hh).toFixed(1)}px;height:${Math.max(5,(Math.min(it.e,1440)-it.s)/60*hh).toFixed(1)}px" title="${esc(it.t.title)}">${it.e-it.s>=45?esc(it.t.title):''}</div>`).join('')+'</div>'});
  const free=days.flatMap(d=>dayTasks(d).filter(t=>t.start==null&&!t.done));
  h+='</div>';
  if(free.length)h+=`<div class="sec-t">بدون وقت محدد</div><div class="chips">${free.map(t=>`<button class="chip tc" style="--tc:var(--c${t.color})" data-a="open" data-id="${t.id}">${ic(t.icon)}${esc(t.title)} · ${DOWL[pd(t.date).getDay()]}</button>`).join('')}</div>`;
  return h}

/* ---------- month ---------- */
function monthView(){const m=UI.month||UI.date.slice(0,7),first=m+'-01',start=weekStartOf(first),td=today();
  let h=`<div class="rowx" style="margin-bottom:10px"><button class="ib" data-a="moBy" data-v="-1" aria-label="الشهر السابق">${ic('chevron_right')}</button><b class="grow" style="text-align:center;font:700 20px var(--f-disp)">${fmtD(first,{month:'long',year:'numeric'})}</b><button class="ib" data-a="moBy" data-v="1" aria-label="الشهر التالي">${ic('chevron_left')}</button></div>`;
  h+='<div class="mo-hd">'+Array.from({length:7},(_,i)=>`<span>${DOW[(S.set.weekStart+i)%7]}</span>`).join('')+'</div><div class="mo">';
  for(let i=0;i<42;i++){const d=addD(start,i),a=dayTasks(d),done=a.filter(t=>t.done).length;
    if(i===35&&d.slice(0,7)!==m)break;
    h+=`<button class="mo-c ${d.slice(0,7)!==m?'out':''} ${d===td?'today':''} ${d===UI.date?'sel':''} ${a.length&&done===a.length?'full':''}" data-a="selDay" data-v="${d}" aria-label="${dateLong(d)}، ${a.length} مهام"><b>${N(pd(d).getDate())}</b><span class="mo-dots">${a.slice(0,6).map(t=>`<i class="${t.done?'d':''}" style="--tc:var(--c${t.color})"></i>`).join('')}</span><em>${a.length?N(done)+'/'+N(a.length):''}</em></button>`}
  h+=`</div><div class="sec-t">${relDay(UI.date)} · ${dateShort(UI.date)}</div>`;
  const a=filtered(UI.date);h+=a.length?a.map(t=>rowHTML(t)).join(''):`<div class="empty"><span>مفيش مهام في اليوم ده.</span><button class="btn sm" data-a="newTask">${ic('add')}أضف مهمة</button></div>`;return h}

/* ---------- navigation actions ---------- */
function horizon(){ensureSeries(addD(UI.date>today()?UI.date:today(),UI.view==='month'?45:21))}
function goDate(d){UI.date=d;UI.month=d.slice(0,7);horizon();render()}
A.setView=el=>{UI.view=el.dataset.v;S.set.view=UI.view;UI.month=UI.date.slice(0,7);horizon();save();render()};
